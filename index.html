const L={"conditionals": "\u003ctitle>Conditionals in Task 2\u003c/title>\n\u003cmeta name=\"claude:viewport-fit-sides\" content=\"cover\">\n\u003clink rel=\"preconnect\" href=\"https://fonts.googleapis.com\">\n\u003clink rel=\"stylesheet\" href=\"https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,700&display=swap\">\n\u003cstyle>\n/* Layout: exam-paper column on graph paper. Brand green hero band, teal IELTS accent, sticky progress bar with section chips. */\n:root{\n  --bg:#FAF6EE;--surface:#FFFEFA;--fg:#16241C;--muted:#566359;--line:#D8D3C2;--grid:rgba(11,110,117,.07);\n  --band:#1B4332;--band-fg:#F3EFE2;--gold:#C9A84C;--warn:#B8420F;--gold-soft:#F6EBC8;--warn-soft:#FCE9DC;\n  --teal:#0B6E75;--teal-soft:#DCEFEF;--ok:#1E6B43;--ok-bg:#E0F1E6;--bad:#A8261E;--bad-bg:#FBE6E3;--mark:#FFF0B8;\n  --on:#fff;--a-w:#C2410C;--a-i:#0B6E75;--a-p:#6D28D9;--a-r:#1D4ED8;--a-v:#15803D;--a-o:#BE185D;--a-e:#B45309;--a-s:#C2410C;--a-x:#0B6E75;\n  --f-d:'Source Serif 4',Georgia,serif;--f-b:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Arial,sans-serif;--f-m:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;\n}\n@media (prefers-color-scheme:dark){:root:not([data-theme=\"light\"]){\n  --bg:#0E1914;--surface:#15241D;--fg:#ECEADD;--muted:#A3B0A7;--line:#2A3C33;--grid:rgba(92,200,206,.07);\n  --band:#0A1F16;--band-fg:#F3EFE2;--gold:#D9BC63;--warn:#FF8A52;--gold-soft:#3E3718;--warn-soft:#4A2A18;\n  --teal:#5CC8CE;--teal-soft:#123A3D;--ok:#7AD7A3;--ok-bg:#17402D;--bad:#FF9088;--bad-bg:#432220;--mark:#4A4217;--on:#06201f;--a-w:#FF9466;--a-i:#5CC8CE;--a-p:#B9A0FF;--a-r:#8FB6FF;--a-v:#6FDB9B;--a-o:#FF92C2;--a-e:#FFC85A;--a-s:#FF9466;--a-x:#5CC8CE;color-scheme:dark}}\n:root[data-theme=\"dark\"]{\n  --bg:#0E1914;--surface:#15241D;--fg:#ECEADD;--muted:#A3B0A7;--line:#2A3C33;--grid:rgba(92,200,206,.07);\n  --band:#0A1F16;--band-fg:#F3EFE2;--gold:#D9BC63;--warn:#FF8A52;--gold-soft:#3E3718;--warn-soft:#4A2A18;\n  --teal:#5CC8CE;--teal-soft:#123A3D;--ok:#7AD7A3;--ok-bg:#17402D;--bad:#FF9088;--bad-bg:#432220;--mark:#4A4217;--on:#06201f;--a-w:#FF9466;--a-i:#5CC8CE;--a-p:#B9A0FF;--a-r:#8FB6FF;--a-v:#6FDB9B;--a-o:#FF92C2;--a-e:#FFC85A;--a-s:#FF9466;--a-x:#5CC8CE;color-scheme:dark}\n\n*{box-sizing:border-box}\nbody{margin:0;background-color:var(--bg);color:var(--fg);font:18px/1.6 var(--f-b);\n  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px}\n.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}\nh1,h2,h3{font-family:var(--f-d);text-wrap:balance;line-height:1.2;margin:0}\np{margin:0 0 .8em}\n.muted{color:var(--muted)}\n.mono{font-family:var(--f-m)}\n\n/* hero */\n.hero{background-color:var(--band);background-image:linear-gradient(120deg,var(--band) 0%,var(--band) 45%,#0B5A60 100%);color:var(--band-fg);border-bottom:4px solid var(--gold);padding-block:36px 30px;position:relative;overflow:hidden}\n.hero::after{content:\"if · would · had\";position:absolute;right:-10px;bottom:-14px;font:500 74px/1 var(--f-m);color:rgba(243,239,226,.06);white-space:nowrap;pointer-events:none}\n.kicker{font:500 12px/1 var(--f-m);letter-spacing:.14em;text-transform:uppercase;color:#F2D57A;margin-bottom:14px}\n.hero h1{font-size:clamp(32px,6vw,52px);font-weight:700;margin-bottom:10px}\n.hero .sub{font-size:18px;max-width:34em;margin-bottom:18px;color:#E4E0D0}\n.meta{display:flex;flex-wrap:wrap;gap:8px 18px;list-style:none;margin:0;padding:0;font:400 13px var(--f-m);color:#CFE6E3}\n.meta li::before{content:\"\";display:inline-block;width:7px;height:7px;background:var(--gold);margin-right:8px}\n\n/* sticky bar */\n.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}\n.barin{display:flex;flex-direction:column;gap:6px;paddi min-width:0}\n.qs>li::before{content:counter(q);font:500 15px/1.9 var(--f-m);color:var(--muted)}\n.qs>li>*{grid-column:2;min-width:0}\n.qp{margin-bottom:8px}\n.wrongs{background:var(--bad-bg);border-radius:4px;padding:1px 6px;text-decoration:line-through;text-decoration-color:var(--bad)}\n.opts{display:grid;gap:6px}\n.opt{text-align:left;font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 12px;cursor:pointer}\n.opt:hover:not(:disabled){border-color:var(--teal);background:var(--teal-soft)}\n.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);font-weight:500}\n.opt.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}\n.fb{font-size:16px;margin:8px 0 0;padding:7px 10px;border-radius:6px;background:var(--teal-soft)}\n.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}\n.gi{padding:8px 10px;border:1px solid transparent;border-radius:6px}\n.gi.ok{background:var(--ok-bg);border-color:var(--ok)}.gi.bad{background:var(--bad-bg);border-color:var(--bad)}\n.gi .fb{background:transparent;padding:4px 0 0;margin:0;color:inherit}\nselect,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;max-width:100%}\ninput[type=text]{border-bottom:2px solid var(--teal);min-height:40px;font-family:var(--f-m);font-size:18px}\nselect{min-height:40px}\ntextarea{width:100%;resize:vertical;line-height:1.5}\n.hint{font:500 17px var(--f-m);color:var(--warn);background:var(--warn-soft);padding:2px 9px;border-radius:4px;margin-left:8px;white-space:nowrap}\n.btn{font:500 16px var(--f-b);background:var(--teal);color:var(--on);border:1px solid var(--teal);border-radius:6px;padding:8px 16px;cursor:pointer}\n.btn.ghost{background:transparent;color:var(--teal);border-color:var(--teal)}\n.btn.sm{padding:6px 12px;font-size:15px}\n.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:ce lor:var(--muted)}\n.tr .exs{font-size:17.5px}\n.tr .wo{font-size:16px;color:var(--warn)}\n.tr b{background:var(--mark);font-weight:500;padding:0 2px;border-radius:2px}\n.tr .wo b,.tr .uj b{color:var(--fg)}\n.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;margin:0 0 10px}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}\n\n/* section accents: each part of the lesson has its own colour */\n#s-w{--acc:var(--a-w)}#s-i{--acc:var(--a-i)}#s-p{--acc:var(--a-p)}#s-r{--acc:var(--a-r)}#s-v{--acc:var(--a-v)}#s-o{--acc:var(--a-o)}#s-e{--acc:var(--a-e)}#s-s{--acc:var(--a-s)}#s-x{--acc:var(--a-x)}\n.sec{--acc:var(--teal)}\n.time{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.sec-h h2{border-left:5px solid var(--acc);padding-left:12px}\n.ex{border-top:4px solid var(--acc)}\n.ex>h3{color:var(--acc)}\n.sec.stretch .time{color:var(--acc);border-color:var(--acc)}\n.model{background:color-mix(in srgb,var(--acc) 13%,var(--surface));border-left:4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar\u003c/p>\n  \u003ch1>Conditionals in Task 2\u003c/h1>\n  \u003cp class=\"sub\">Learn which conditional does which job in an essay, then turn plain Band 6 sentences into Band 7+ ones.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Solutions · Advantages and disadvantages · Opinion\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence below has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: which structure does which job?\u003c/h2>\u003cp class=\"lead\">In Task 2 you must suggest, compare, warn and admit. Each job has a conditional that fits.\u003c/p>\u003c/div>\n  \u003cdiv class=\"map\" id=\"map\">\u003c/div>\n  \u003cp class=\"tblh\">Reference table: structures and formulas\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>condition part\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>result part\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>The flip: fact → imagined fact\u003c/h3>\n    \u003cp>Type 2, Type 3 and mixed conditionals describe things that are \u003cb>not true\u003c/b>. So you must flip the real fact: positive becomes negative, negative becomes positive.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Real fact\u003c/small>Gyms are \u003cb>expensive\u003c/b>, so few people \u003cb>exercise\u003c/b>.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Imagined\u003c/small>If gyms \u003cb>were cheaper\u003c/b>, more people \u003cb>would exercise\u003c/b>.\u003c/div>\u003c/div>\n    \u003cp class=\"note\">Remember: flip both parts. Expensive becomes cheaper, and few becomes more.\u003c/p>\n    \u003cp style=\"margin-top:14px\">\u003cb>The upgrade ladder\u003c/b>\u003c/p>\n    \u003cdiv class=\"ladder\">\u003cdiv>\u003csmall>Plain · Band 6\u003c/small>Many people avoid exercise because gyms are too expensive.\u003c/div>\u003cdiv>\u003csmall>Conditional · Band 7\u003c/small>If gyms were cheaper, more people would exercise.\u003c/div>\u003cdiv>\u003csmall>Formal · Band 7.5\u003c/small>Were gyms to become cheaper, more people would exercise.\u003c/div>\u003c/div>\n    \u003col class=\"steps\">\u003cli>Find the \u003cb>cause\u003c/b> and the \u003cb>result\u003c/b>.\u003c/li>\u003cli>Choose the time: past, present or future.\u003c/li>\u003cli>Flip the fact.\u003c/li>\u003cli>Optional: make it formal with \u003ci>Were … to\u003c/i>, \u003ci>Had\u003c/i> or \u003ci>Should\u003c/i>.\u003c/li>\u003c/ol>\n  \u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by job\u003c/h3>\u003cp class=\"task\">What job does each sentence do in an essay?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: form, then write it yourself\u003c/h2>\u003cp class=\"lead\">Four steps: recognise the form, fill it in, flip the fact, then write your own sentences.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Choose the form\u003c/h3>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write the verb form\u003c/h3>\u003cp class=\"task\">Put the verb in brackets into the correct form. You may need extra words (\u003ci>to\u003c/i>, \u003ci>had\u003c/i>, \u003ci>not\u003c/i>).\u003c/p>\u003cdiv id=\"m-pb\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Flip the fact\u003c/h3>\u003cp class=\"task\">Rewrite each real fact with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Write your own\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words. Tip: copy your three best sentences by hand into your notebook. Extra practice: good for homework too.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: conditionals at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Solutions essay · traffic\u003c/h3>\n    \u003cdiv class=\"read\">Many hospitals now struggle with long waiting lists. One solution is to prevent illness before it starts. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>If employers offered free health checks, workers would notice problems much earlier.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Provided that the tests are simple and quick, most staff will take part.\u003c/mark> In addition, sugary snacks should be taxed. \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Unless food companies pay for the damage their products cause, they will have little reason to change recipes.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Had these measures been introduced twenty years ago, hospitals would not be so crowded today.\u003c/mark>\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Advantages and disadvantages · remote work\u003c/h3>\n    \u003cdiv class=\"read\">Tourism has clear advantages and disadvantages for small towns. On the positive side, visitors bring money and new jobs. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>If more tourists stayed for a week instead of a day, local hotels and restaurants would earn far more.\u003c/mark> However, there are drawbacks. \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Were the number of visitors to double, residents would find it harder to use their own streets.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Even if tourist taxes rise, the most popular towns will still attract huge crowds.\u003c/mark> Overall, the benefits are real, but councils must plan carefully.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: idea banks\u003c/h2>\u003cp class=\"lead\">Conditionals need ideas. Here are useful phrases for three common Task 2 topics.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. Two phrases are extra.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: the paraphrase lab\u003c/h2>\u003cp class=\"lead\">Upgrade plain sentences, then write a short paragraph of your own.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Upgrade the sentence\u003c/h3>\u003cp class=\"task\">Rewrite each plain sentence using the structure shown. Remember to flip the fact.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different conditional structures.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Mixed 2 → 3: recognise it, then avoid it\u003c/h3>\u003cp class=\"task\">You may see \u003cspan class=\"mono\">If + past simple, would have + past participle\u003c/span> in reading texts. In your own essays it is safer to use Type 3. Rewrite each sentence as Type 3.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence is Band 6 with a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Go formal\u003c/h3>\u003cp class=\"task\">Rewrite each sentence without \u003ci>if\u003c/i>, using \u003ci>Were … to\u003c/i>, \u003ci>Had\u003c/i> or \u003ci>Should\u003c/i>.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Conditionals and Mixed Conditionals. Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='cond-state-v3';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Conditionals in Task 2: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={if:'if-clause',unless:'Unless',evenif:'Even if',provided:'Provided that',wereto:'Were … to',had:'Had (inversion)',should:'Should (inversion)'};\nfunction detect(t){\n  const x=t.replace(/\\r/g,''),y=x.replace(/\\beven if\\b/ig,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  if(/\\bunless\\b/i.test(x))s.add('unless');\n  if(/\\beven if\\b/i.test(x))s.add('evenif');\n  if(/\\b(provided that|providing that|as long as)\\b/i.test(x))s.add('provided');\n  if(/(^|[.!?]\\s*)were\\s+(\\w+\\s+){1,3}to\\s+\\w+/i.test(x)||/\\bif\\s+(\\w+\\s+){1,3}were\\s+to\\s+\\w+/i.test(x))s.add('wereto');\n  if(/(^|[.!?]\\s*)had\\s+(\\w+\\s+){1,4}\\w+/i.test(x))s.add('had');\n  if(/(^|[.!?]\\s*)should\\s+(\\w+\\s+){1,3}\\w+/i.test(x))s.add('should');\n  if(/\\bif\\b/i.test(y))s.add('if');\n  const warns=[];\n  if(/\\bunless\\b[^.?!]*(\\bnot\\b|n't\\b)/i.test(x))warns.push('Unless already means “if not”. Remove the second negative.');\n  if(/\\bif\\s+(\\w+\\s+){0,5}(will|would)\\b/i.test(y))warns.push('Check the if-clause: do not put will or would right after if.');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different conditional structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst FN=['Admit a point, then argue back','Link a past decision to today’s problem','Offer a solution','Show the result of an idea','Warn about what will happen'];\nconst STRUCT=['Even if','Had (inversion)','Mixed 3→2','Provided that','Should (inversion)','Type 1','Type 2','Type 3','Unless','Were to'];\nconst TBL=[\n ['Core structures'],\n ['Type 1','If + present simple, will + verb','Offer a realistic solution','If the government \u003cb>subsidises\u003c/b> solar panels, more households \u003cb>will switch\u003c/b> to clean energy.','After if, never use will.'],\n ['Type 2','If + past simple, would + verb','Imagine a different present or an unlikely future','If employers \u003cb>offered\u003c/b> gym membership, staff \u003cb>would take\u003c/b> fewer sick days.','Use were for every subject: If prisons \u003cb>were\u003c/b> smaller …'],\n ['Type 3','If + past perfect, would have + past participle','Talk about a past that did not happen','If hospitals \u003cb>had trained\u003c/b> more nurses, waiting lists \u003cb>would have been\u003c/b> shorter.','Not: If hospitals would have trained …'],\n ['Mixed 3→2','If + past perfect, would + verb','Show how a past decision created today’s problem','If the town \u003cb>had protected\u003c/b> its old harbour, tourism \u003cb>would be\u003c/b> stronger today.','The main clause has no have: would be, not would have be.'],\n ['Mixed 2→3 (better not to use)','If + past simple, would have + past participle','Present situation → past result. It exists, but it is rare','If young people \u003cb>were\u003c/b> more aware of fake news, fewer of them \u003cb>would have shared\u003c/b> the false story.','Often unclear in an essay. Use Type 3 or Mixed 3→2 instead.'],\n ['Formal upgrade (no if)'],\n ['Were … to','Were + subject + to + verb, would + verb','Formal Type 2','\u003cb>Were\u003c/b> prisons \u003cb>to focus\u003c/b> on training, fewer prisoners \u003cb>would reoffend\u003c/b>.','Always were, never was. After to, use the base verb.'],\n ['Had (inversion)','Had + subject + past participle, would have + past participle','Formal Type 3','\u003cb>Had\u003c/b> farmers \u003cb>received\u003c/b> early warnings, they \u003cb>would have saved\u003c/b> more of the harvest.','Negative: Had farmers not received …'],\n ['Should (inversion)','Should + subject + verb, will + verb','Formal Type 1','\u003cb>Should\u003c/b> the council \u003cb>build\u003c/b> more affordable flats, young families \u003cb>will stay\u003c/b> in the city.','Here should means “if by chance”, not “must”.'],\n ['Linking words'],\n ['Unless','Unless + positive verb, will + verb','Warn what will happen','\u003cb>Unless\u003c/b> doctors \u003cb>spot\u003c/b> the disease early, treatment \u003cb>will remain\u003c/b> expensive.','Unless already means if not. Do not add another negative.'],\n ['Provided that / As long as','Provided that + present simple, will + verb','Set a strict condition','\u003cb>Provided that\u003c/b> tourists \u003cb>respect\u003c/b> local customs, small towns \u003cb>will benefit\u003c/b> from visitors.','Provided that is more formal than as long as.'],\n ['Even if','Even if + clause, main clause','Admit a point, then argue back','\u003cb>Even if\u003c/b> robots \u003cb>become\u003c/b> cheaper, many shoppers \u003cb>will still prefer\u003c/b> human assistants.','Even if = it may happen. Even though = it is true.']\n];\nconst BANKS=[\n ['Health',[['balanced diet','a healthy mix of foods'],['sedentary lifestyle','sitting most of the day'],['preventive care','stopping illness early'],['waiting list','people waiting for treatment'],['life expectancy','how long people live'],['obesity rate','how many people are very overweight']]],\n ['Energy',[['solar panel','a plate that makes power from sunlight'],['power grid','the national electricity network'],['energy bills','the cost of gas and electricity'],['wind farm','a group of wind turbines'],['carbon footprint','the gases one person or company produces'],['insulation','material that keeps heat inside']]],\n ['Crime',[['reoffend','commit another crime'],['sentence','the punishment from a court'],['deterrent','something that stops people from acting'],['burglary','stealing from a home'],['community service','unpaid work as a punishment'],['rehabilitation','helping criminals to change']]]\n];\nfunction build(){\n  Object.keys(ST).forEach(k=>delete ST[k]);\n  /* warm-up */\n  const W=[\n   ['If hospitals would hire more nurses, waiting times would fall.',['If hospitals hired more nurses, waiting times would fall.','If hospitals would hire more nurses, waiting times would fall.','If hospitals will hire more nurses, waiting times would fall.'],'Type 2 needs the past simple after if: \u003cb>If hospitals hired\u003c/b> … \u003cb>would fall\u003c/b>. Never put would after if.'],\n   ['Unless people do not sleep enough, their health will suffer.',['Unless people sleep enough, their health will suffer.','Unless people don’t sleep enough, their health will suffer.','Unless people will sleep enough, their health will suffer.'],'Unless already means “if not”. Use a positive verb after it.'],\n   ['If the government would have funded wind farms, the country would depend less on coal today.',['If the government had funded wind farms, the country would depend less on coal today.','If the government would have funded wind farms, the country would depend less on coal today.','If the government has funded wind farms, the country would depend less on coal today.'],'Mixed 3→2: \u003cb>If + had funded\u003c/b>, \u003cb>would depend\u003c/b>. No would in the if-clause.'],\n   ['If prisons was smaller, inmates would get more attention.',['If prisons were smaller, inmates would get more attention.','If prisons would be smaller, inmates would get more attention.','If prisons are smaller, inmates would get more attention.'],'In Type 2 use \u003cb>were\u003c/b> for every subject.'],\n   ['Were courts impose longer sentences, crime would fall.',['Were courts to impose longer sentences, crime would fall.','Were courts impose longer sentences, crime would fall.','Would courts impose longer sentences, crime would fall.'],'The formal Type 2 pattern is \u003cb>Were + subject + to + verb\u003c/b>.'],\n   ['If the clinic will open on Sundays, more patients will visit.',['If the clinic opens on Sundays, more patients will visit.','If the clinic will open on Sundays, more patients will visit.','If the clinic opened on Sundays, more patients will visit.'],'Type 1: \u003cb>present simple\u003c/b> after if, \u003cb>will\u003c/b> in the result.']\n  ];\n  $('#m-w').innerHTML=W.map((w,i)=>mcq('w'+(i+1),'w','Warm-up '+(i+1),`\u003cspan class=\"wrongs\">${w[0]}\u003c/span>\u003cbr>Choose the correct version.`,w[1],0,w[2])).join('');\n  /* input: sort */\n  $('#map').innerHTML=[['Offer a solution','Type 1 · Should · Provided that'],['Show the result of an idea','Type 2 · Were … to'],['Link a past decision to today’s problem','Mixed 3→2 · Had'],['Say what would have happened','Type 3 · Had'],['Warn about what will happen','Unless'],['Admit a point, then argue back','Even if']].map(r=>`\u003cdiv>\u003cb>${r[0]}\u003c/b>\u003cspan>${r[1]}\u003c/span>\u003c/div>`).join('');\n  const fmt=f=>{const i=f.indexOf(', ');return i\u003c0?`\u003cspan class=\"c1\">${f}\u003c/span>`:`\u003cspan class=\"c1\">${f.slice(0,i)}\u003c/span>\u003cspan class=\"sep\">,\u003c/span>\u003cspan class=\"c2\">${f.slice(i+2)}\u003c/span>`};\n  $('#tbl').innerHTML=TBL.map(r=>r.length===1?`\u003cdiv class=\"grp\">${r[0]}\u003c/div>`:`\u003cdiv class=\"tr\">\u003cdiv class=\"st\">${r[0]}\u003c/div>\u003cdiv class=\"fm\">${fmt(r[1])}\u003c/div>\u003cdiv class=\"uj\">\u003cstrong>Use it to:\u003c/strong> ${r[2]}\u003c/div>\u003cdiv class=\"exs\">${r[3]}\u003c/div>\u003cdiv class=\"wo\">\u003cstrong>Watch out:\u003c/strong> ${r[4]}\u003c/div>\u003c/div>`).join('');\n  $('#m-i').innerHTML=gapBlock('i','i','Sort',[\n   {s:'“If employers offered gym membership, staff would take fewer sick days.”',a:FN[3],e:'Type 2 shows the result of an imagined change.'},\n   {s:'“If the council subsidises solar panels, more households will switch to clean energy.”',a:FN[2],e:'Type 1 gives a realistic solution.'},\n   {s:'“If the town had protected its old harbour, tourism would be stronger today.”',a:FN[1],e:'Mixed 3→2: past decision, present problem.'},\n   {s:'“Unless doctors spot the disease early, treatment will remain expensive.”',a:FN[4],e:'Unless warns about a result.'},\n   {s:'“Even if robots become cheaper, many shoppers will still prefer human assistants.”',a:FN[0],e:'Even if admits a point, then argues back.'},\n   {s:'“Provided that sentences are fair, the public will accept tougher punishments.”',a:FN[2],e:'Provided that sets a strict condition for a solution.'},\n   {s:'“Had the airport been built further away, r var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.grp{font:500 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--bg);padding:10px 16px;border-top:1px solid var(--line)}\n.grp:first-child{border-top:0}\n.tr{display:grid;grid-template-columns:190px minmax(0,1fr);gap:6px 22px;padding:16px;border-top:1px solid var(--line)}\n.tr>div{min-width:0}\n.tr .st{font:600 20px/1.25 var(--f-d);grid-row:1/span 4}\n.tr .fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}\n.tr .fm .c1,.tr .fm .c2{font:500 16px/1.4 var(--f-m);padding:6px 11px;border-radius:6px;color:var(--fg)}\n.tr .fm .c1{background:var(--teal-soft);border:1px solid var(--teal)}\n.tr .fm .c2{background:var(--gold-soft);border:1px solid var(--gold)}\n.tr .fm .sep{font:500 20px var(--f-m);color:var(--muted)}\n.tr .uj{font-size:16px;color:var(--muted)}\n.tr .exs{font-size:17.5px}\n.tr .wo{font-size:16px;color:var(--warn)}\n.tr b{background:var(--mark);font-weight:500;padding:0 2px;border-radius:2px}\n.tr .wo b,.tr .uj b{color:var(--fg)}\n.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;margin:0 0 10px}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}\n\n/* section accents: each part of the lesson has its own colour */\n#s-w{--acc:var(--a-w)}#s-i{--acc:var(--a-i)}#s-p{--acc:var(--a-p)}#s-r{--acc:var(--a-r)}#s-v{--acc:var(--a-v)}#s-o{--acc:var(--a-o)}#s-e{--acc:var(--a-e)}#s-s{--acc:var(--a-s)}#s-x{--acc:var(--a-x)}\n.sec{--acc:var(--teal)}\n.time{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.sec-h h2{border-left:5px solid var(--acc);padding-left:12px}\n.ex{border-top:4px solid var(--acc)}\n.ex>h3{color:var(--acc)}\n.sec.stretch .time{color:var(--acc);border-color:var(--acc)}\n.model{background:color-mix(in srgb,var(--acc) 13%,var(--surface));border-left:4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n.flip .no{background:var(--bad-bg);border-color:var(--bad)}\n.flip small b{font-weight:500}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar · Part 1\u003c/p>\n  \u003ch1>Concession in Task 2\u003c/h1>\n  \u003cp class=\"sub\">Admit the other side, then win the argument. Five structures that lift a plain Band 6 sentence to Band 7+.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Discuss both views · Opinion · Advantages and disadvantages\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: admit one point, argue another\u003c/h2>\u003cp class=\"lead\">A concession admits the opposite point, then returns to your own argument. Five structures do this job.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Why it matters\u003c/h3>\n    \u003cp>Grammatical Range and Accuracy is one of the four Writing criteria. Concession is one of the fastest ways to show range.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Band 6\u003c/small>I agree \u003cb>or\u003c/b> I disagree. No shades.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Band 7+\u003c/small>I admit the opposite point \u003cb>and\u003c/b> argue back.\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tblh\">Reference table: five structures\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>the point you admit\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>your main point\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>The “this” test\u003c/h3>\n    \u003cp>After \u003cb>despite\u003c/b> and \u003cb>in spite of\u003c/b> you need a noun phrase, not a clause. Put \u003cb>this\u003c/b> in its place: \u003ci>Despite this\u003c/i> works, \u003ci>Despite he works\u003c/i> does not.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv class=\"no\">\u003csmall>Not this\u003c/small>Despite technology \u003cb>has changed\u003c/b> communication, …\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>This\u003c/small>Despite the \u003cb>profound changes\u003c/b> brought by technology, …\u003c/div>\u003c/div>\n    \u003cp class=\"note\">An -ing form also works: \u003ci>Despite working long hours, …\u003c/i> “Despite the fact that + clause” is correct, but it is long. A noun phrase is shorter and sounds more academic.\u003c/p>\n  \u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>See the upgrade\u003c/h3>\u003cdiv id=\"up\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by structure\u003c/h3>\u003cp class=\"task\">Which structure does each sentence use?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: recognise it, then write it yourself\u003c/h2>\u003cp class=\"lead\">Five steps: the this-test, choose the word, type the word, combine sentences, turn clauses into noun phrases.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · The “this” test\u003c/h3>\u003cp class=\"task\">Is the sentence correct?\u003c/p>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Choose the best answer\u003c/h3>\u003col class=\"qs\" id=\"m-pb\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Type the missing word or phrase\u003c/h3>\u003cp class=\"task\">Write the linking word or words. Sometimes more than one answer is possible.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Combine the sentences\u003c/h3>\u003cp class=\"task\">Join each pair into one Band 7+ sentence with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>E · From clause to noun phrase\u003c/h3>\u003cp class=\"task\">Rewrite each sentence with \u003cb>Despite\u003c/b> or \u003cb>In spite of\u003c/b>. Turn the clause into a noun phrase. Tip: copy your three best sentences by hand into your notebook.\u003c/p>\u003cdiv id=\"m-pe\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: concession at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Task 2 · advertising to children\u003c/h3>\n    \u003cdiv class=\"read\">Some people want to ban advertising aimed at children. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Despite the money it brings to television channels, children’s advertising can encourage unhealthy habits.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Although parents can switch the television off, many adverts now appear on phones and tablets.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>While companies argue that adverts inform families, children often cannot tell information from persuasion.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Admittedly, a complete ban would be difficult to enforce. Nevertheless, stricter rules would protect young viewers.\u003c/mark> For these reasons, governments should limit advertising to children.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Task 1 · tourism statistics (sample data)\u003c/h3>\n    \u003cdiv class=\"read\">The graph shows the number of visitors to three countries between 2000 and 2020. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Despite a sharp fall in 2009, visitor numbers in Spain rose steadily over the period.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Although France attracted the highest number of visitors throughout, its growth was slower than that of Turkey.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>While Turkey began with the lowest figure, it overtook Spain in 2015.\u003c/mark> Overall, all three countries recorded significant growth.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: noun phrases for concessions\u003c/h2>\u003cp class=\"lead\">Despite and in spite of need a noun phrase. Learn these as ready-made chunks.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. One phrase is extra.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: your own concessions\u003c/h2>\u003cp class=\"lead\">Write single sentences first, then a short paragraph.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Write your own sentence\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different concession structures.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n  \u003cp class=\"note\">Next lesson: Concession Part 2 — That said, Much as, Granted (that), Even if, However + adjective.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Make it shorter\u003c/h3>\u003cp class=\"task\">“Despite the fact that + clause” is correct but long. Rewrite each sentence with a noun phrase after Despite.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence has a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Use a semicolon\u003c/h3>\u003cp class=\"task\">Join each pair with \u003cspan class=\"mono\">Admittedly …; nevertheless, …\u003c/span> in one sentence.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Conditionals and Mixed Conditionals. Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='conc-state-v2';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Concession in Task 2: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={despite:'Despite',inspite:'In spite of',although:'Although / Even though',while:'While / Whilst',admittedly:'Admittedly … Nevertheless'};\nfunction detect(t){\n  const x=t.replace(/\\r/g,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  if(/\\bdespite\\b/i.test(x))s.add('despite');\n  if(/\\bin spite\\b/i.test(x))s.add('inspite');\n  if(/\\b(although|even though|though)\\b/i.test(x))s.add('although');\n  if(/\\bwhil(e|st)\\b/i.test(x))s.add('while');\n  if(/\\badmittedly\\b/i.test(x))s.add('admittedly');\n  const warns=[];\n  if(/\\bdespite of\\b/i.test(x))warns.push('Say Despite or In spite of. Never “despite of”.');\n  if(/\\bin spite (?!of\\b)/i.test(x))warns.push('The phrase is in spite of (three words).');\n  if(/\\b(despite|in spite of)\\s+(i|you|he|she|it|we|they|there)\\s+\\w+/i.test(x))warns.push('After Despite / In spite of use a noun phrase, not a clause. Test: Despite THIS.');\n  if(/\\b(although|even though|though)\\b[^.?!]*,\\s*(but|however|yet)\\b/i.test(x))warns.push('Do not add but, however or yet after Although / Even though.');\n  if(/\\badmittedly\\b[^.?!;]*,\\s*(nevertheless|however|nonetheless)\\b/i.test(x))warns.push('Use a full stop or a semicolon before Nevertheless / However, not a comma.');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different concession structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst STRUCT=['Admittedly … Nevertheless','Although / Even though','Despite','In spite of','While / Whilst'];\nconst TBL=[\n ['Concession with a noun phrase'],\n ['Despite','Despite + noun phrase, main clause','Admit a counter-argument briefly at the start of the sentence','\u003cb>Despite\u003c/b> the rising cost of flights, more people than ever are choosing to travel abroad.','After despite use a noun phrase. Test: Despite THIS. Never “despite of”.'],\n ['In spite of','In spite of + noun phrase, main clause','Same job, more formal. Use it when despite has already appeared. Very useful in Task 1','\u003cb>In spite of\u003c/b> repeated warnings about sun damage, many holidaymakers still avoid sunscreen.','Three words: in spite of. Never “in spite” and never “despite of”. Noun phrase only.'],\n ['Concession with a clause'],\n ['Although / Even though','Although / Even though + clause, main clause','Keep a full clause as it is. Even though sounds stronger','\u003cb>Even though\u003c/b> most newspapers now publish online, many readers still prefer to hold a printed copy.','Needs a subject and a verb. Do not add but or however in the main clause. Even though = a true fact. Even if = a possibility.'],\n ['While / Whilst','While / Whilst + clause, main clause','Set two ideas or two data points side by side, softly','\u003cb>While\u003c/b> a foreign language can open doors, it no longer guarantees a better salary.','While can also mean “at the same time”. If the meaning is unclear, use although.'],\n ['Two-step concession'],\n ['Admittedly … Nevertheless','Admittedly + clause | Nevertheless + clause','Admit a strong point from the other side, then return to your own. Good before a conclusion','\u003cb>Admittedly\u003c/b>, advertising can inform consumers about useful products. \u003cb>However\u003c/b>, it often encourages people to buy things they do not need.','Two separate sentences: full stop (or semicolon) before Nevertheless / However, and a comma after it.']\n];\nconst UP=[\n ['Despite','Tourism brings valuable income to small islands. However, it also damages their coral reefs.','Despite the valuable income it brings to small islands, tourism also damages their coral reefs.'],\n ['In spite of','Sales of paper books fell by 15%. Even so, they remained more popular than e-books.','In spite of a 15% fall in sales, paper books remained more popular than e-books.'],\n ['Although','Advertising is very expensive. Small firms still use it to compete.','Although advertising is very expensive, small firms still use it to compete.'],\n ['While','English is spoken in many countries. Local languages remain important to national identity.','While English is spoken in many countries, local languages remain important to national identity.'],\n ['Admittedly … Nevertheless','Messaging apps are fast. They cannot replace a face-to-face conversation.','Admittedly, messaging apps are fast and convenient. Nevertheless, they cannot replace a face-to-face conversation.']\n];\nconst BANKS=[\n ['Tourism',[['mass tourism','very large numbers of visitors'],['tourist attraction','a place visitors want to see'],['package holiday','travel and hotel sold together'],['peak season','the busiest time of year'],['local economy','money made inside a town or region'],['sustainable travel','travel that protects places']]],\n ['Media and advertising',[['target audience','the people an advert is made for'],['brand loyalty','buying the same brand again'],['breaking news','news that has just happened'],['misleading advert','an advert that gives a false idea'],['circulation','the number of copies a paper sells'],['social media influencer','a person who promotes products online']]],\n ['Language',[['mother tongue','the first language you learn'],['bilingual','able to speak two languages'],['fluency','speaking easily and smoothly'],['language barrier','a problem when people do not share a language'],['translation app','a phone tool that translates'],['dialect','a local form of a language']]]\n];\nfunction build(){\n  Object.keys(ST).forEach(k=>delete ST[k]);\n  /* warm-up */\n  const W=[\n   ['Despite the museum was free, few tourists visited it.',['Although the museum was free, few tourists visited it.','Despite the museum was free, few tourists visited it.','Despite of the museum was free, few tourists visited it.'],'A full clause (\u003ci>the museum was free\u003c/i>) needs \u003cb>although\u003c/b>. Despite needs a noun phrase.'],\n   ['In spite the heavy rain, the festival went ahead.',['In spite of the heavy rain, the festival went ahead.','In spite the heavy rain, the festival went ahead.','Despite of the heavy rain, the festival went ahead.'],'The phrase has three words: \u003cb>in spite of\u003c/b>.'],\n   ['Although the film received poor reviews, but it won three awards.',['Although the film received poor reviews, it won three awards.','Although the film received poor reviews, but it won three awards.','Although the film received poor reviews, however it won three awards.'],'Do not add \u003cb>but\u003c/b> or \u003cb>however\u003c/b> in the main clause after although.'],\n   ['Although the cost of advertising, many small shops use it.',['Despite the cost of advertising, many small shops use it.','Although the cost of advertising, many small shops use it.','Although despite the cost of advertising, many small shops use it.'],'Although needs a clause. A noun phrase needs \u003cb>despite\u003c/b>.'],\n   ['Admittedly, translation apps are convenient, nevertheless they make mistakes.',['Admittedly, translation apps are convenient. Nevertheless, they m

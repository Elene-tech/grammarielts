ackground:color-mix(in srgb,var(--acc) 13%,var(--surface));border-left:4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n.flip .no{background:var(--bad-bg);border-color:var(--bad)}\n.flip small b{font-weight:500}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar\u003c/p>\n  \u003ch1>Inversion in Task 2 · Part 1\u003c/h1>\n  \u003cp class=\"sub\">Not only … but also, Only by, Only when, Never / Rarely, So … that. Five safe and high-impact inversions for Band 7+.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Discuss both views · Opinion · Task 1 · Solutions\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: one rule for all five structures\u003c/h2>\u003cp class=\"lead\">Inversion means putting the auxiliary verb before the subject, after a “trigger” phrase at the start of the sentence. It adds emphasis and shows grammatical range.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Why it matters\u003c/h3>\n    \u003cp>Band 6 sentences “work”. Band 7+ sentences show that the writer \u003cb>controls\u003c/b> the sentence. Inversion is one of the fastest ways to show it. Today: five structures that are safe and high-impact.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Band 6\u003c/small>Artificial intelligence has changed education.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Band 7+\u003c/small>\u003cb>Not only has artificial intelligence\u003c/b> changed education, …\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tblh\">Reference table: five structures\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>the trigger and the inverted verb\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>the rest of the sentence\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>The mechanics: only the auxiliary moves\u003c/h3>\n    \u003cp>\u003cb>trigger phrase + AUXILIARY + SUBJECT + main verb\u003c/b>\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv class=\"no\">\u003csmall>Not this\u003c/small>Not only artificial intelligence \u003cb>has\u003c/b> changed education, …\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>This\u003c/small>Not only \u003cb>has artificial intelligence\u003c/b> changed education, …\u003c/div>\u003c/div>\n    \u003cp class=\"note\">The main verb stays in its place. Only the auxiliary (has, does, did, can, is …) moves in front of the subject. If the sentence has no auxiliary, add do / does / did: Not only \u003ci>does\u003c/i> mass tourism \u003ci>damage\u003c/i> coastlines.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>See the upgrade\u003c/h3>\u003cdiv id=\"up\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by structure\u003c/h3>\u003cp class=\"task\">Which structure does each sentence use?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: recognise it, then write it yourself\u003c/h2>\u003cp class=\"lead\">Five steps: check, choose, type, combine, rewrite.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Is the order correct?\u003c/h3>\u003cp class=\"task\">Is the sentence correct?\u003c/p>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Choose the best answer\u003c/h3>\u003col class=\"qs\" id=\"m-pb\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Type the missing word\u003c/h3>\u003cp class=\"task\">Write the missing auxiliary or word. Sometimes more than one answer is possible.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Combine the sentences\u003c/h3>\u003cp class=\"task\">Join each pair into one Band 7+ sentence with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>E · Rarely / Seldom / Never\u003c/h3>\u003cp class=\"task\">Rewrite each sentence. Start with the word in the heading and invert. Tip: copy your three best sentences by hand into your notebook.\u003c/p>\u003cdiv id=\"m-pe\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: the structure at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Discuss both views · technology and AI\u003c/h3>\n    \u003cdiv class=\"read\">Artificial intelligence is entering classrooms and offices. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Not only does it save teachers hours of marking, but it also gives students instant feedback.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Rarely have schools had the chance to personalise learning on such a scale.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>So convincing are AI-generated essays that teachers struggle to spot cheating.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Only by teaching students to question what they read can schools prepare them for this future.\u003c/mark> On balance, the benefits outweigh the risks.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Task 1 · tourism (line graph, sample data)\u003c/h3>\n    \u003cdiv class=\"read\">The line graph shows annual visitors to a coastal resort between 2000 and 2020. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Not only did visitor numbers double between 2000 and 2010, but they also reached a peak of 2.4 million in 2019.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>So sharp was the fall in 2020 that numbers dropped to 0.6 million.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Rarely did the figure rise above 2 million before 2015.\u003c/mark> Overall, tourism grew steadily until the sudden collapse in 2020.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: ready-made chunks\u003c/h2>\u003cp class=\"lead\">These phrases fit naturally after an inversion trigger. Learn them as chunks.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. Use each phrase once.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: your own sentences\u003c/h2>\u003cp class=\"lead\">Write single sentences first, then a short paragraph.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Write your own sentence\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different structures from today.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n  \u003cp class=\"note\">Next lesson: Inversion Part 2 (Hardly / Not until / Only after / Such is / Little do).\u003c/p>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Transform the sentences\u003c/h3>\u003cp class=\"task\">Rewrite each sentence with the structure shown.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence has a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Add the second argument\u003c/h3>\u003cp class=\"task\">Join each pair into one sentence with \u003cb>Not only … but also\u003c/b>.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Inversion in Task 2 (Part 1). Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='inv1-state-v2';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Inversion in Task 2 · Part 1: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={notonly:'Not only … but also',onlyby:'Only by + -ing',onlywhen:'Only when / if',never:'Never / Rarely / Seldom',so:'So + adjective + that'};\nfunction detect(t){\n  const x=t.replace(/\\r/g,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  const AUX='(has|have|had|does|do|did|is|are|was|were|can|could|will|would|should|must|may|might)';\n  if(new RegExp('\\\\bnot only\\\\s+'+AUX+'\\\\b','i').test(x))s.add('notonly');\n  if(/\\bonly by\\s+\\w+ing\\b/i.test(x))s.add('onlyby');\n  if(/\\bonly\\s+(when|if)\\b/i.test(x))s.add('onlywhen');\n  if(new RegExp('(^|[.!?]\\\\s+)(never|rarely|seldom)\\\\s+'+AUX+'\\\\b','i').test(x))s.add('never');\n  if(new RegExp('\\\\bso\\\\s+\\\\w+\\\\s+'+AUX+'\\\\s+[^.?!]*\\\\bthat\\\\b','i').test(x))s.add('so');\n  const warns=[];\n  if(new RegExp('\\\\bnot only\\\\s+(?!'+AUX+'\\\\b)\\\\w+\\\\s+'+AUX+'\\\\b','i').test(x))warns.push('After Not only put the auxiliary first: Not only HAS technology changed …');\n  if(/\\bbut also\\s+(it|they|he|she|we|you|i)\\b/i.test(x)&&/\\bnot only\\b/i.test(x))warns.push('Keep also next to the verb: but it ALSO transformed …, not “but also it …”.');\n  if(/\\bonly by\\s+\\w+ing[^,.?!]*,/i.test(x))warns.push('No comma after Only by + -ing phrase: Only by investing in schools can …');\n  if(/(^|[.!?]\\s+)(never|rarely|seldom)\\s+(i|you|he|she|it|we|they)\\s+\\w+/i.test(x))warns.push('After Never / Rarely / Seldom put the auxiliary before the subject: Rarely have they …');\n  if(/\\bso\\s+\\w+\\s+the\\s+\\w+(\\s+\\w+)?\\s+(is|are|was|were)\\s+that\\b/i.test(x))warns.push('Verb before subject: So severe IS the shortage that …');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst STRUCT=['Not only … but also','Only by + -ing','Only when / if','Never / Rarely / Seldom','So + adjective + that'];\nconst TBL=[\n ['Add an idea'],\n ['Not only … but also','Not only + aux + S + V | but S also + V','Give two arguments in one sentence instead of two short ones','\u003cb>Not only has\u003c/b> artificial intelligence changed how students learn, \u003cb>but it has also\u003c/b> raised questions about cheating.','Only the auxiliary moves: Not only HAS artificial intelligence changed. The second part is a normal clause. Keep also next to the verb.'],\n ['The only way or the only condition'],\n ['Only by + -ing','Only by + verb-ing + aux + S + V','Write a solution paragraph: this is the only way to reach the result','\u003cb>Only by banning\u003c/b> single-use plastics \u003cb>can governments\u003c/b> hope to protect marine life.','No comma after the -ing phrase. The auxiliary of the MAIN clause inverts: can governments.'],\n ['Only when / if','Only when / if + clause + aux + S + V','Give a condition for a result. Good for conclusions','\u003cb>Only when\u003c/b> universities teach practical skills \u003cb>do\u003c/b> graduates become attractive to employers.','Only the main clause inverts. The when / if clause keeps normal order.'],\n ['Strong claims'],\n ['Never / Rarely / Seldom','Never / Rarely / Seldom + aux + S + V','Make a confident claim about something unusual or negative','\u003cb>Rarely have tourists\u003c/b> considered the damage they cause to fragile ecosystems.','Use it for negative or exceptional ideas only. On a normal positive fact it sounds unnatural.'],\n ['So + adjective + that','So + adj / adv + aux + S ~ that + clause','Show the scale of a problem and its result','\u003cb>So rapid is\u003c/b> the spread of misinformation online \u003cb>that\u003c/b> fact-checkers struggle to keep up.','The adjective comes first. With be, the verb moves: So rapid IS the spread. Not the same as Such is (noun), see Part 2.']\n];\nconst UP=[\n ['Not only','Online courses are cheap. They are also flexible.','Not only are online courses cheap, but they are also flexible enough to suit working adults.'],\n ['Only by','Cities can protect historic buildings by limiting tourist numbers.','Only by limiting tourist numbers can cities protect their historic buildings from damage.'],\n ['Only when','Advertising is honest. Then consumers trust brands.','Only when advertising is honest do consumers come to trust the brands they buy.'],\n ['Rarely','Governments have rarely controlled fake news without limiting free speech.','Rarely have governments managed to control fake news without also limiting free speech.'],\n ['So … that','Plastic pollution in the oceans is serious. Several countries have banned plastic bags.','So serious is plastic pollution in the oceans that several countries have banned plastic bags.']\n];\nconst BANKS=[\n ['After Only by …',[['limiting tourist numbers','a solution for cities'],['recycling more plastic','a solution for the environment'],['updating the curriculum','a solution for schools'],['regulating algorithms','a solution for technology'],['cutting packaging','a solution for companies'],['sharing data openly','a solution for science']]],\n ['After Never / Rarely / Seldom',[['have tourists considered …','a negative result'],['have universities offered …','something new'],['does advertising tell …','an honest fact'],['do users read …','a rare habit'],['has technology advanced …','an extreme level'],['have oceans faced …','a rare danger']]],\n ['After So …',[['severe is the damage to …','a problem'],['rapid is the spread of …','a trend'],['widespread is the use of …','a habit'],['strong is the appeal of …','a force'],['great is the demand for …','a trend'],['serious is the threat of …','a danger']]]\n];\nfunction build(){\n  Object.keys(ST).forEach(k=>delete ST[k]);\n  const W=[\n   ['Not only artificial intelligence has changed education, but it has also changed jobs.',['Not only has artificial intelligence changed education, but it has also changed jobs.','Not only artificial intelligence has changed education, but it has also changed jobs.','Not only has artificial intelligence changed education, but also it changed jobs.'],'After Not only put the \u003cb>auxiliary\u003c/b> before the subject: has artificial intelligence.'],\n   ['Only by banning plastic bags, can countries protect marine life.',['Only by banning plastic bags can countries protect marine life.','Only by banning plastic bags, can countries protect marine life.','Only by banning plastic bags countries can protect marine life.'],'No comma, and the auxiliary comes before the subject: \u003cb>can countries\u003c/b>.'],\n   ['Only when tourists respect local culture communities benefit.',['Only when tourists respect local culture do communities benefit.','Only when tourists respect local culture communities benefit.','Only when do tourists respect local culture communities benefit.'],'Invert the main clause: \u003cb>do\u003c/b> communities benefit.'],\n   ['Rarely universities have offered courses in these skills.',['Rarely have universities offered courses in these skills.','Rarely universities have offered courses in these skills.','Rarely universities offered courses in these skills.'],'Auxiliary before subject: \u003cb>have universities\u003c/b>.'],\n   [ 4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n.flip .no{background:var(--bad-bg);border-color:var(--bad)}\n.flip small b{font-weight:500}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar\u003c/p>\n  \u003ch1>Inversion in Task 2 · Part 2\u003c/h1>\n  \u003cp class=\"sub\">Hardly, Not until, Only after, Such is, Little do. Five formal inversions for precise, not frequent, use.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Opinion · Discuss both views · Task 1 · Solutions\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: formal and narrative inversions\u003c/h2>\u003cp class=\"lead\">These five structures are more about sequence of events and formal tone than about a direct argument. They add range, but only when they fit. Each one has a “when NOT to use it” note.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Why it matters\u003c/h3>\n    \u003cp>In Part 1 you learned safe, high-impact inversions. These five are different: \u003cb>precision, not quantity\u003c/b>. Use one or two in an essay, in the right place.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Band 6\u003c/small>The rise in traffic was so rapid.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Band 7+\u003c/small>\u003cb>Such was the rise\u003c/b> in traffic that …\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tblh\">Reference table: five structures\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>the trigger and the inverted verb\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>the rest of the sentence\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>The same rule, bigger triggers\u003c/h3>\n    \u003cp>\u003cb>trigger phrase + AUXILIARY + SUBJECT + main verb\u003c/b>\u003c/p>\n    \u003cp>In Part 1 the trigger was often one word (Never, Rarely). Here it is often a whole phrase: \u003ci>Hardly … when\u003c/i>, \u003ci>Not until …\u003c/i>, \u003ci>Only after …\u003c/i>. The auxiliary still moves in front of the subject. The main verb stays.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv class=\"no\">\u003csmall>Not this\u003c/small>Not until cycle lanes appeared many commuters \u003cb>left\u003c/b> their cars at home.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>This\u003c/small>Not until cycle lanes appeared \u003cb>did many commuters leave\u003c/b> their cars at home.\u003c/div>\u003c/div>\n    \u003cp class=\"note\">Only the main clause inverts. The clause after Not until / Only after keeps normal order.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>See the upgrade\u003c/h3>\u003cdiv id=\"up\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by structure\u003c/h3>\u003cp class=\"task\">Which structure does each sentence use?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: recognise it, then write it yourself\u003c/h2>\u003cp class=\"lead\">Five steps: check, choose, type, combine, rewrite.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Is the order correct?\u003c/h3>\u003cp class=\"task\">Is the sentence correct?\u003c/p>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Choose the best answer\u003c/h3>\u003col class=\"qs\" id=\"m-pb\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Type the missing word\u003c/h3>\u003cp class=\"task\">Write the missing word. Sometimes more than one answer is possible.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Combine the sentences\u003c/h3>\u003cp class=\"task\">Join each pair into one Band 7+ sentence with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>E · Only after / Only then\u003c/h3>\u003cp class=\"task\">Rewrite each sentence. Start with \u003cb>Only after\u003c/b> (or \u003cb>Only then\u003c/b>) and invert the main clause. Tip: copy your three best sentences by hand into your notebook.\u003c/p>\u003cdiv id=\"m-pe\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: the structure at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Opinion · transport and cities\u003c/h3>\n    \u003cdiv class=\"read\">Traffic jams are a daily problem in big cities. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Not until cycle lanes were built did many commuters leave their cars at home.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Hardly had the new tram line opened when residents asked for more routes.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Such was the growth in car ownership that city centres became permanently congested.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Only after the council introduced a congestion charge did journey times improve.\u003c/mark> Clearly, cities must offer real alternatives.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Task 1 · cycling in a city (table, sample data)\u003c/h3>\n    \u003cdiv class=\"read\">The table shows the number of daily cyclists in one city in 2005, 2012 and 2022. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Not until 2012 did the figure exceed 10,000.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Such was the rise by 2022 that the total reached 31,000.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Only after 2012 did growth become rapid.\u003c/mark> Overall, cycling grew sharply, especially in the last decade.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: ready-made chunks\u003c/h2>\u003cp class=\"lead\">These chunks fit naturally into Part 2 structures. Learn them as ready-made phrases.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. Use each phrase once.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: your own sentences\u003c/h2>\u003cp class=\"lead\">Write single sentences first, then a short paragraph.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Write your own sentence\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different structures from today.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n  \u003cp class=\"note\">This was the last inversion lesson. Remember: one or two inversions per essay are enough.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Transform the sentences\u003c/h3>\u003cp class=\"task\">Rewrite each sentence with the structure shown.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence has a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Only then\u003c/h3>\u003cp class=\"task\">Rewrite each pair with \u003cb>Only then\u003c/b> and invert the second sentence.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Inversion in Task 2 (Part 2). Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='inv2-state-v2';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Inversion in Task 2 · Part 2: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={hardly:'Hardly / Barely / Scarcely',notuntil:'Not until',onlyafter:'Only after / Only then',such:'Such is / was the …',little:'Little do / did'};\nfunction detect(t){\n  const x=t.replace(/\\r/g,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  if(/\\b(hardly|barely|scarcely)\\s+(had|have|has|did|do|does|was|were)\\b/i.test(x))s.add('hardly');\n  if(/\\bnot until\\b/i.test(x))s.add('notuntil');\n  if(/\\bonly (after|then)\\b/i.test(x))s.add('onlyafter');\n  if(/\\bsuch\\s+(is|was|were|are)\\b/i.test(x))s.add('such');\n  if(/\\blittle\\s+(do|did|does)\\b/i.test(x))s.add('little');\n  const warns=[];\n  if(/\\b(hardly|barely|scarcely)\\b[^.?!]*\\bthan\\b/i.test(x))warns.push('After Hardly / Barely / Scarcely use when or before, never than.');\n  if(/\\b(hardly|barely|scarcely)\\s+(i|you|he|she|it|we|they|the)\\s+\\w+/i.test(x))warns.push('After Hardly / Barely / Scarcely put the auxiliary first: Hardly HAD the law passed …');\n  if(/\\bnot until\\b[^.?!]*\\b(they|he|she|we|it|i|you)\\s+(realised|realized|understood|began|started|noticed|took|made|decided|acted|introduced)\\b/i.test(x))warns.push('After Not until + clause, invert the main clause: … did they realise.');\n  if(/\\bonly after\\b[^.?!,]*,\\s+(it|they|he|she|we|the \\w+|many \\w+)\\s+\\w+(ed|s)\\b/i.test(x))warns.push('Check the inversion: Only after … was the law passed / did the company agree.');\n  if(/\\bsuch\\s+(is|was|were|are)\\b[^.?!]*\\bthat\\s+(is|was|did|do|does|has|have)\\s+\\w+/i.test(x))warns.push('After that the clause has normal order: … that governments have declared …');\n  if(/\\blittle\\s+(i|you|he|she|it|we|they|\\w+s)\\s+(realise|realize|know|knew|expect)/i.test(x))warns.push('Use Little do / did + subject: Little do students realise …');\n  if((x.match(/\\b(hardly|barely|scarcely)\\s+(had|have|has|did|do|does|was|were)\\b|\\bnot until\\b|\\bonly (after|then)\\b|\\bsuch\\s+(is|was)\\b|\\blittle\\s+(do|did)\\b/gi)||[]).length>2)warns.push('Use these structures sparingly: one or two per essay.');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst STRUCT=['Hardly / Barely / Scarcely','Not until','Only after / Only then','Such is / was the …','Little do / did'];\nconst TBL=[\n ['Sequence and timing'],\n ['Hardly / Barely / Scarcely','Hardly / Barely / Scarcely + aux + S + V | when / before + clause','Show one event followed immediately by another','\u003cb>Scarcely had\u003c/b> the new stadium opened \u003cb>when\u003c/b> residents complained about the noise.','Use when or before, never than. Rare in essays: one per essay at most. It can sound like a story.'],\n ['Not until','Not until + time / clause | aux + S + V','Show that an action came late. Good for criticising a slow reaction. Also useful in Task 1 for dates','\u003cb>Not until\u003c/b> cycle lanes appeared \u003cb>did\u003c/b> many commuters leave their cars at home.','Only the main clause inverts. The Not until part keeps normal order.'],\n ['Only after / Only then','Only after + noun / clause | aux + S + V','Show that one event had to happen FIRST','\u003cb>Only after\u003c/b> a congestion charge was introduced \u003cb>did\u003c/b> journey times improve.','This is about order. Only when / if (Part 1) is about a condition. Only then = a short form: Only then did the scale become clear.'],\n ['Scale and irony'],\n ['Such is / was the …','Such is / was the + noun phrase ~ that + clause','Stress the size of something with a NOUN. Very formal','\u003cb>Such is the popularity\u003c/b> of streaming \u003cb>that\u003c/b> many cinemas have closed.','Only Such is / was inverts. After that the clause is normal. Such + noun, but So + adjective.'],\n ['Little do / did','Little + do / did + S + realise / know ~ that + clause','Show an ironic lack of awareness','\u003cb>Little do\u003c/b> many fans \u003cb>realise that\u003c/b> professional athletes often retire before the age of thirty-five.','Rhetorical and rare: one per essay at most. No inversion after that.']\n];\nconst UP=[\n ['Hardly','The museum reduced its entry fees. Visitor numbers began to rise at once.','Hardly had the museum reduced its entry fees when visitor numbers began to rise.'],\n ['Not until','Many cities did not build cycle lanes until traffic became unbearable.','Not until traffic became unbearable did many cities build cycle lanes.'],\n ['Only after','The council introduced a congestion charge. Then journey times improved.','Only after the council introduced a congestion charge did journey times improve.'],\n ['Such is','The popularity of streaming is huge. Many cinemas have closed.','Such is the popularity of streaming that many cinemas have closed.'],\n ['Little do','Many fans do not realise that professional athletes often retire before thirty-five.','Little do many fans realise that professional athletes often retire before the age of thirty-five.']\n];\nconst BANKS=[\n ['After Only after / Not until',[['a congestion charge was introduced','a policy change'],['cycle lanes appeared','a new facility'],['the museum cut its fees','a price change'],['the 1980s','a time in history'],['funding was approved','a decision'],['the population began to age','a trigger event']]],\n ['After Such is / was …',[['the popularity of …','how popular'],['the growth in …','how fast'],['the pressure on …','how heavy'],['the pace of change','how fast'],['the influence of …','how powerful'],['the extent of the delay','how serious']]],\n ['After Little do / did …',[['many fans realise that …','a hidden fact'],['city planners know that …','a past surprise'],['young drivers realise that …','a common mistake'],['voters understand that …','a lack of awareness'],['tourists expect that …','an unexpected result'],['people suspect that …','something hidden']]]\n];\nfunction build(){\n  Object.keys(ST).forEach(k=>delete ST[k]);\n  const W=[\n   ['Hardly the museum had opened when long queues formed.',['Hardly had the museum opened when long queues formed.','Hardly the museum had opened when long queues formed.','Hardly the museum opened when long queues formed.'],'Auxiliary before subject: \u003cb>had the museum\u003c/b>.'],\n   ['Hardly had the tram line opened than residents asked for more routes.',['Hardly had the tram line opened when residents asked for more routes.','Hardly had the tram line opened than residents asked for more routes.','Hardly had the tram line opened that residents asked for more routes.'],'Use \u003cb>when\u003c/b> (or before), never than.'],\n   ['Not until cycle lanes were built, many commuters left their cars at home.',['Not until cycle lanes were built did many commuters leave their cars at home.','Not until cycle lanes were built, many commuters left their cars at home.','Not until cycle lanes were built did many commuters left their cars at home.'],'Invert the main clause: \u003cb>did many commuters leave\u003c/b>.'],\n   ['Only after the council introduced a charge the traffic eased.',['Only after the council introduced a charge did the traffic ease.','Only after the council introduced a charge the traffic eased.','Only after the council introduced a charge did the tra

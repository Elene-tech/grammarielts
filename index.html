ze:16.5px;margin:6px 0;cursor:pointer}\n.sc input{margin-top:5px;width:18px;height:18px;accent-color:var(--ok)}\n.tools{margin:26px 0 10px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}\n.small{font-size:15px;color:var(--muted)}\n.forms{margin-top:8px;font-size:16px;color:var(--muted)}\n.forms b{color:var(--teal);font-weight:600}\n.forms div{margin-top:3px}\n.plan{margin-top:12px;background:var(--teal-soft);border:1px solid var(--teal);border-radius:12px;padding:12px 16px}\n.plan h4{font:500 12px var(--f-m);letter-spacing:.12em;text-transform:uppercase;color:var(--teal);margin-bottom:6px}\n.plan ol{padding-left:22px;font-size:17px}.plan li{margin:5px 0}.plan li b{color:var(--teal)}\n.st{margin-top:10px}.st summary,.rem summary{cursor:pointer;font-weight:600;color:var(--teal);font-size:16.5px}\n.st ul{margin:8px 0 0 20px;font-size:17px;font-style:italic;color:var(--muted)}\n.rem{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 18px;margin-bottom:18px}\n.rem .rb{margin-top:10px;display:grid;gap:8px;font-size:16.5px}\n.rem .rb div b{color:var(--teal)}\n.empty{padding:30px;text-align:center;color:var(--muted)}\n@media(max-width:560px){body{font-size:17px}.head{flex-direction:column;gap:8px}.src{font-size:18px}header{padding:24px 18px 20px}}\n\u003c/style>\n\u003c/head>\n\u003cbody>\n\u003cdiv class=\"wrap\">\n\u003cheader>\n  \u003cdiv class=\"kick\">Target English · IELTS Writing · Grammar for Essays\u003c/div>\n  \u003ch1>Mixed Practice: all the structures\u003c/h1>\n  \u003cp>Conditionals, concession, participles, relative clauses, nominalisation, cleft sentences, inversion and passive voice, with extra cleft practice. Write your own sentence first. Then open the model and compare.\u003c/p>\n\u003c/header>\n\u003cdiv class=\"bar\">\u003cdiv class=\"track\">\u003cdiv class=\"fill\" id=\"fill\">\u003c/div>\u003c/div>\u003cdiv class=\"lab\" id=\"lab\">0 / 0\u003c/div>\u003cdiv class=\"save\" id=\"save\">\u003c/div>\u003c/div>\n\n\u003cdiv class=\"tabs\" id=\"tabs\">\u003c/div>\n\u003cdiv class=\"how\" id=\"how\">\u003c/div>\n\u003cdetails class=\"rem\">\u003csummary>Structure reminders (formulas)\u003c/summary>\u003cdiv class=\"rb\" id=\"remb\">\u003c/div>\u003c/details>\n\u003cdiv class=\"chips\" id=\"chips\">\u003c/div>\n\u003cdiv id=\"board\">\u003c/div>\n\n\u003cdiv class=\"tools\">\n  \u003cbutton class=\"btn ghost\" id=\"copy\">Copy all my answers\u003c/button>\n  \u003cbutton class=\"btn ghost\" id=\"reset\">Start again\u003c/button>\n  \u003cspan class=\"small\" id=\"msg\">\u003c/span>\n\u003c/div>\n\u003cp class=\"small\">Your answers stay in this page only. Use “Copy all my answers” to send your work to your teacher.\u003c/p>\n\u003c/div>\n\u003cscript>\nconst $=s=>document.querySelector(s);\nconst FAM={cond:'Conditionals',conc:'Concession',part:'Participles',rel:'Relative clauses',nom:'Nominalisation',cleft:'Cleft sentences',inv:'Inversion',pas:'Passive voice'};\nconst FORM={\n cond:'If + past simple, would + verb · If + past perfect, would have + V3 · Were … to / Had … / Unless',\n conc:'Despite + noun phrase · Although + clause · While + clause · Admittedly …. Nevertheless …',\n part:'…, -ing result · Having + V3, … · Faced with …, … · Not + -ing',\n rel:'noun + who / which / whose + clause · , which (whole idea) · noun + -ing / -ed',\n nom:'verb / adjective → noun · Due to + noun phrase · noun phrase + led to / contributed to',\n cleft:'It is … that … · What … is … · The reason why … is that … · It is not … but … that',\n pas:'is / was + V3 · has been + V3 · modal + be + V3 · It is believed that … · risk + being + V3',\n inv:'Not only + aux + S … · Only by + -ing + aux + S · Rarely + aux + S · So + adj + aux + S + that · Hardly had … when · Not until … did …'\n};\n/* Tab 1: guided. Each family: [sentence, hint, model, alt, note] */\nconst G={\ncond:[\n ['Many amateur athletes get injured because they skip the warm-up.','Type 2 conditional','If amateur athletes did not skip the warm-up, fewer of them would get injured.','Amateur athletes would suffer fewer injuries if they warmed up properly.','Flip the fact: skip → did not skip. Type 2 = if + past simple, would + verb.'],\n ['Tourists crowd the old town because there are no attractions elsewhere.','Type 2 conditional','If there were more attractions outside the centre, tourists would not crowd the old town.','Were more attractions to open outside the centre, tourists would no longer crowd the old town.','Flip the fact: no attractions → more attractions.'],\n ['The museum did not advertise online, so few young people visited.','Type 3 conditional','If the museum had advertised online, more young people would have visited.','Had the museum advertised online, many more young people would have visited.','Type 3 = if + past perfect, would have + V3. Inverted: Had + S + V3.'],\n ['Many farmers cannot afford irrigation, so their crops fail in dry summers.','Unless / Provided that','Unless farmers can afford irrigation, their crops will fail in dry summers.','Crops will survive dry summers provided that farmers can afford irrigation.','Unless = if … not, so do not add another negative.']],\nconc:[\n ['Electric scooters are fun and cheap. They cause many accidents.','Admittedly … Nevertheless','Admittedly, electric scooters are fun and cheap. Nevertheless, they cause many accidents.','While electric scooters are fun and cheap, they cause many accidents.','Two separate sentences: full stop before Nevertheless.'],\n ['The film had a tiny budget. It won three international awards.','Despite + noun phrase','Despite its tiny budget, the film won three international awards.','In spite of its tiny budget, the film won three international awards.','After Despite use a noun phrase. Test: Despite THIS.'],\n ['Many people love city life. They dream about living in the countryside.','Although / Even though','Even though many people love city life, they dream about living in the countryside.','Although many people love city life, many of them dream of a quiet life in the countryside.','Full clause after although. No “but” in the main clause.'],\n ['The new library is modern and spacious. Few students use it.','While / Whilst','Whilst the new library is modern and spacious, few students use it.','Despite being modern and spacious, the new library is rarely used.','While + clause sets two ideas side by side.']],\npart:[\n ['Heavy snow fell overnight. It closed roads across the region.','Result -ing phrase','Heavy snow fell overnight, closing roads across the region.','Heavy snow fell overnight, which closed roads across the region.','After a comma use -ing: closing, causing, leaving.'],\n ['The chef had trained in Paris for years. He opened his own restaurant.','Having + past participle','Having trained in Paris for years, the chef opened his own restaurant.','After training in Paris for years, the chef opened his own restaurant.','The first action finished before the second. Same subject in both parts.'],\n ['Small businesses are given little support, so they struggle to survive.','Past participle opener (Given …)','Given little support, small businesses struggle to survive.','Offered little support, small businesses struggle to survive.','The businesses are given support: past participle.'],\n ['Volunteers did not receive any training, so they felt unprepared.','Not + -ing','Not receiving any training, the volunteers felt unprepared.','Not having received any training, the volunteers felt unprepared.','Put Not before the -ing form.']],\nrel:[\n ['Some coaches shout at players. Those coaches lose the team’s respect.','Defining clause (who)','Coaches who shout at players lose the team’s respect.','Coaches shouting at players lose the team’s respect.','No commas: the clause tells us which coaches.'],\n ['Iceland has fewer than 400,000 people. Iceland produces almost all its electricity from renewable sources.','Non-defining clause (, which)','Iceland, which has fewer than 400,000 people, produces almost all its electricity from renewable sources.','With fewer than 400,000 people, Iceland produces almost all its electricity from renewable sources.','Extra information goes between commas. Never “that” here.'],\n ['Some villages have lost their only shop. Their young people leave for the cities.','whose','Villages whose only shop has closed lose their young people to the cities.','Villages that have lost their only shop see their young people leave for the cities.','Whose + noun shows possession.'],\n ['Ticket prices have doubled. This has kept many fans away from stadiums.',', which (whole idea)','Ticket prices have doubled, which has kept many fans away from stadiums.','The doubling of ticket prices has kept many fans away from stadiums.',', which refers to the whole first idea.']],\nnom:[\n ['Because airlines cancelled many flights, thousands of passengers were stranded.','Due to + noun phrase','Due to the cancellation of many flights, thousands of passengers were stranded.','Because of widespread flight cancellations, thousands of passengers were stranded.','cancelled → the cancellation of. After Due to use a noun phrase.'],\n ['Some players are very aggressive. This often leads to red cards.','Adjective → noun','Aggression on the pitch often leads to red cards.','Players’ aggression often leads to red cards.','aggressive → aggression.'],\n ['Companies advertise more aggressively. Children now ask for more toys.','Verb → noun + cause verb','The growth of aggressive advertising has led to a rise in children’s demand for toys.','Increased advertising has made children ask for more toys.','advertise → advertising. Make the idea the subject.'],\n ['People are living longer. This puts a strain on pension systems.','Noun phrase as subject','Increased life expectancy puts a strain on pension systems.','The rise in life expectancy is straining pension systems.','Avoid “People …” as the subject. Name the trend.']],\ncleft1:[\n ['Parents influence a child’s reading habits more than schools do.','It-cleft','It is parents who influence a child’s reading habits more than schools do.','It is parents rather than schools that shape a child’s reading habits.','It is + focus + who / that. Who for people.'],\n ['Most football matches are won through teamwork, not individual talent.','It is not … but … that','It is not individual talent but teamwork that wins most football matches.','It is teamwork, not individual talent, that wins most football matches.','Correct a common belief. X and Y are the same type of phrase.'],\n ['The printing press changed European society in the fifteenth century.','It-cleft (focus on a time)','It was in the fifteenth century that the printing press changed European society.','It was the printing press that changed European society in the fifteenth century.','The focus can be a time. Use that after it.'],\n ['People often think luxury hotels make a trip memorable. Friendly local people do.','It is not … but … that','It is not luxury hotels but friendly local people that make a trip memorable.','It is friendly local people, not luxury hotels, that make a trip memorable.','Use that after the focus, not what.']],\ncleft2:[\n ['Museums should offer more interactive exhibits.','What-cleft','What museums should offer is more interactive exhibits.','What museums should offer are more interactive exhibits.','What + clause + is + focus. Is or are can follow a plural focus.'],\n ['Small farms need fair prices.','Reverse what-cleft','Fair prices are what small farms need.','What small farms need is fair prices.','Focus + is / are what + clause.'],\n ['Commuters only want reliable trains.','All-cleft','All that commuters want is reliable trains.','What commuters really want is reliable trains.','All that = the only thing.'],\n ['The city council should plant more trees.','What-cleft with do','What the city council should do is plant more trees.','What the council should do is to plant more trees.','After do … is the verb has no to (to is optional but rare in essays).']],\ncleft3:[\n ['Many people give up learning an instrument because they cannot practise regularly.','The reason why … is that','The main reason why many people give up learning an instrument is that they cannot practise regularly.','Many people give up learning an instrument mainly because they cannot practise regularly.','In formal writing: is that, not is because.'],\n ['Cinemas are losing audiences because streaming is cheaper and more convenient.','The reason why … is that','The reason why cinemas are losing audiences is that streaming is cheaper and more convenient.','What is driving audiences away from cinemas is the lower cost and convenience of streaming.','Two good routes to the same idea.'],\n ['Denmark’s wind farms succeed because of careful government planning.','It-cleft','It is careful government planning that makes Denmark’s wind farms succeed.','What makes Denmark’s wind farms succeed is careful government planning.','It is + focus + that + verb.'],\n ['Public libraries matter because they give everyone free access to information.','What matters … is that','What matters about public libraries is that they give everyone free access to information.','What makes public libraries valuable is their free access to information.','What + clause + is that + clause.']],\ninv1:[\n ['The new stadium creates jobs. It also attracts international visitors.','Not only … but also','Not only does the new stadium create jobs, but it also attracts international visitors.','The new stadium not only creates jobs but also attracts international visitors.','Only the auxiliary moves: Not only DOES the stadium create.'],\n ['Communities can protect endangered languages by recording their elders’ stories.','Only by + -ing','Only by recording their elders’ stories can communities protect endangered languages.','Communities can protect endangered languages only by recording their elders’ stories.','No comma. The auxiliary comes before the subject: can communities.'],\n ['Orchestras will survive only if they receive public funding.','Only if / Only when','Only if orchestras receive public funding will they survive.','Orchestras will survive only if they receive public funding.','Only the main clause inverts: will they survive.'],\n ['Small countries have seldom won the World Cup.','Never / Rarely / Seldom','Seldom have small countries won the World Cup.','Small countries have only rarely won the World Cup.','Seldom + aux + S + V.']],\ninv2:[\n ['The singer left the stage. The crowd immediately started chanting for more.','Hardly … when','Hardly had the singer left the stage when the crowd started chanting for more.','As soon as the singer left the stage, the crowd started chanting for more.','Hardly + had + S + V3 … when (never than).'],\n ['People did not appreciate clean rivers until they were gone.','Not until','Not until clean rivers were gone did people appreciate them.','People only appreciated clean rivers after they were gone.','Only the main clause inverts: did people appreciate.'],\n ['The flooding was severe. Thousands of people left their homes.','Such was the …','Such was the severity of the flooding that thousands of people left their homes.','The flooding was so severe that thousands of people left their homes.','Such + be + noun phrase + that + normal clause: severe → severity.'],\n ['Many collectors do not realise that some antique toys are worthless.','Little do …','Little do many collectors realise that some antique toys are worthless.','Many collectors are unaware that some antique toys are worthless.','Rhetorical: one per essay at most.']]\n\n,pas:[\n ['Workers collect the waste paper and sort it by quality.','Simple passive','The waste paper is collected and sorted by quality.','First, waste paper is collected, and it is then sorted by quality.','The object becomes the subject: is + V3. The workers are not important.'],\n ['People have built too many roads through national parks.','Perfect passive','Too many roads have been built through national parks.','National parks have been divided by roads built over the last decade.','has / have been + V3 for change up to now.'],\n ['Many people believe that online learning saves time.','Reporting passive','It is widely believed that online learning saves time.','Online learning is believed to save time.','It is believed THAT + clause, or X is believed TO + verb.'],\n ['Cities must repair old bridges before they become dangerous.','Modal passive','Old bridges must be repaired before they become dangerous.','Before old bridges become dangerous, they must be inspected and repaired.','modal + be + V3.']]\n};\nconst MX=[\n ['Wolves were reintroduced to Yellowstone. The ecosystem recovered.','The reintroduction of wolves to Yellowstone helped the ecosystem to recover.','nom','Wolves, which were reintroduced to Yellowstone, helped the ecosystem to recover.','rel','Verb → noun: reintroduced → the reintroduction.'],\n ['Coffee prices have risen. Many small cafés have closed.','The rise in coffee prices has forced many small cafés to close.','nom','Coffee prices have risen, forcing many small cafés to close.','part','Result -ing after a comma.'],\n ['Students rarely read for pleasure. They have no free time.','Having no free time, students rarely read for pleasure.','part','What prevents students from reading for pleasure is a lack of free time.','cleft','Same subject in both parts of the participle sentence.'],\n ['The team lost the final. They had played brilliantly all season.','Despite playing brilliantly all season, the team lost the final.','conc','The team, which had played brilliantly all season, lost the final.','rel','Despite + -ing or noun phrase.'],\n ['Many city dwellers do not know where their food comes from.','Little do many city dwellers know about where their food comes from.','inv','What many city dwellers lack is knowledge of where their food comes from.','cleft','Little do is rhetorical: use it once at most.'],\n ['The government banned plastic bags. Turtle deaths began to fall.','Only after plastic bags were banned did turtle deaths begin to fall.','inv','The ban on plastic bags led to a fall in turtle deaths.','nom','Only after + clause + did + S.'],\n ['Many commuters drive alone. Rush-hour traffic is terrible.','If fewer commuters drove alone, rush-hour traffic would not be so terrible.','cond','What makes rush-hour traffic so terrible is the number of commuters driving alone.','cleft','Flip the fact for a Type 2 conditional.'],\n ['Online banks are cheap. Customers worry about security.','Although online banks are cheap, customers worry about security.','conc','Worried about security, many customers avoid online banks.','part','Although + full clause, no “but”.'],\n ['Volunteers cleaned the beach. They found hundreds of plastic bottles.','Cleaning the beach, the volunteers found hundreds of plastic bottles.','part','The volunteers who cleaned the beach found hundreds of plastic bottles.','rel','Same subject in both parts.'],\n ['Teachers spend hours marking. They have little time to plan lessons.','The hours spent on marking leave teachers little time to plan lessons.','nom','Teachers, who spend hours marking, have little time to plan lessons.','rel','Noun phrase subject + cause verb.'],\n ['Young drivers cause many accidents because they lack experience.','The main reason why young drivers cause many accidents is that they lack experience.','cleft','Lack of experience leads young drivers to cause many accidents.','nom','The reason why … is that …'],\n ['Mountain glaciers are melting fast. Villages below them face floods.','So fast are mountain glaciers melting that villages below them face floods.','inv','Mountain glaciers are melting fast, which means that villages below them face floods.','rel','So + adjective / adverb + aux + S + that.'],\n ['Elderly people feel lonely. They have few visitors.','Elderly people, who have few visitors, often feel lonely.','rel','Having few visitors, elderly people often feel lonely.','part','Non-defining clause between commas.'],\n ['Cheap clothes are popular. They create huge amounts of waste.','While cheap clothes are popular, they create huge amounts of waste.','conc','The popularity of cheap clothes has led to huge amounts of waste.','nom','While + clause for contrast.'],\n ['Many pupils find science boring. Teachers use only textbooks.','If teachers used more than textbooks, pupils would not find science so boring.','cond','It is the reliance on textbooks that makes science boring for many pupils.','cleft','Flip the fact: use only → used more than.'],\n ['Fishing communities could not predict the storm. Their boats were destroyed.','Had fishing communities been able to predict the storm, their boats would not have been destroyed.','cond','Not being able to predict the storm, fishing communities lost their boats.','part','Inverted Type 3: Had + S + V3.'],\n ['Many people trust online reviews. They do not realise that many are fake.','Little do people realise that many online reviews are fake.','inv','What many people overlook is that numerous online reviews are fake.','cleft','Little do + S + realise that.'],\n ['The government subsidised solar panels. Home installations doubled.','The subsidy for solar panels led to a doubling of home installations.','nom','Not until solar panels were subsidised did home installations double.','inv','Subsidised → the subsidy for; doubled → a doubling of.'],\n ['Some jobs pay very little. They are essential to society.','Whilst some jobs pay very little, they are essential to society.','conc','Some jobs, which pay very little, are essential to society.','rel','While + clause.'],\n ['Doctors can detect many diseases early by using regular screening.','Only by using regular screening can doctors detect many diseases early.','inv','It is regular screening that allows doctors to detect many diseases early.','cleft','Only by + -ing + can + S.'],\n ['The company changed its name. Its sales rose immediately.','Hardly had the company changed its name when its sales began to rise.','inv','Having changed its name, the company saw its sales rise immediately.','part','Hardly + had + S + V3 … when.'],\n ['Wealthy countries consume most of the world’s resources. Poor countries suffer the consequences.','It is wealthy countries that consume most of the world’s resources, but poor countries that suffer the consequences.','cleft','Poor countries suffer the consequences of resources consumed mostly by wealthy countries.','rel','Two It-clefts for contrast.'],\n ['Children were given tablets at an early age. Their handwriting suffered.','Given tablets at an early age, children often have weaker handwriting.','part','Early use of tablets leads to a decline in children’s handwriting.','nom','Past participle opener: children are given tablets.'],\n ['Rural hospitals have few doctors. Patients wait for weeks.','If rural hospitals had more doctors, patients would not wait for weeks.','cond','The shortage of doctors in rural hospitals forces patients to wait for weeks.','nom','Flip the fact: few → more.'],\n ['Many students cheat in exams. They are afraid of failing.','The reason why many students cheat in exams is that they are afraid of failing.','cleft','Fear of failing drives many students to cheat in exams.','nom','afraid → fear.'],\n ['Marathon runners train for months. They rarely quit.','Having trained for months, marathon runners rarely quit.','part','Rarely do marathon runners quit once they have trained for months.','inv','Having + V3 shows the earlier action.'],\n ['Rural areas have poor internet. Online learning is difficult there.','So poor is the internet in rural areas that online learning is difficult there.','inv','Poor internet connections in rural areas make online learning difficult.','nom','So + adjective + is + S + that.'],\n ['Street art is often illegal. Many cities now welcome it.','Although street art is often illegal, many cities now welcome it.','conc','Street art, which is often illegal, is now welcomed by many cities.','rel','Although + full clause.'],\n ['Teenagers want independence. They do not want less support.','What teenagers want is independence, not less support.','cleft','Teenagers who want independence do not necessarily want less support.','rel','What + clause + is + focus.'],\n ['Parents talk to their children about money. The children save more as adults.','If parents talked to their children about money, the children would save more as adults.','cond','Only when parents talk to children about money do the children learn to save as adults.','inv','Type 2 for a general hypothetical.'],\n ['Hackers stole customers’ details from the bank. The bank lost their trust.','Customers’ details were stolen from the bank, and the bank lost their trust.','pas','Having had their details stolen, customers lost trust in the bank.','part','The passive hides the doer because the details matter more.'],\n ['Doctors give antibiotics too often. Bacteria become resistant.','The overuse of antibiotics makes bacteria resistant.','nom','Because antibiotics are given too often, bacteria become resistant.','pas','Overuse is the noun form; the passive keeps the doctors out of the sentence.'],\n ['Experts think that rising sea levels will flood many coastal cities.','It is thought that rising sea levels will flood many coastal cities.','pas','The rise in sea levels is expected to flood many coastal cities.','nom','It is thought THAT + clause. Or: X is expected TO + verb.'],\n ['Satellites collect weather data. Forecasters use it to warn people about storms.','Weather data is collected by satellites and used to warn people about storms.','pas','Satellites, which collect weather data, help forecasters to warn people about storms.','rel','Two passives share one subject: is collected … and used.'],\n ['Volunteers planted thousands of trees. The hillside became green again.','Thousands of trees were planted by volunteers, and the hillside became green again.','pas','Planted by volunteers, thousands of trees turned the hillside green again.','part','A past participle phrase has a passive meaning without be.'],\n ['The council did not warn residents about the flood. Many lost their cars.','Residents were not warned about the flood, so many lost their cars.','pas','Had residents been warned about the flood, fewer would have lost their cars.','cond','Passive in the model; inverted type 3 conditional in the alternative.'],\n];\nconst PP=[\n ['Sport','Many children quit sport as teenagers. They feel pressure to win. They stop enjoying it. Coaches should focus on fun.','\u003cb>Pressure to win is what\u003c/b> drives many children to quit sport as teenagers, \u003cb>leading to\u003c/b> a loss of enjoyment. \u003cb>Only by focusing\u003c/b> on fun \u003cb>can coaches\u003c/b> keep young players involved.',['Nominalisation','Reverse what-cleft','Result -ing','Only by + inversion'],\n  [['Nominalisation + reverse what-cleft','feel pressure to win → Pressure to win is what drives …'],['Result -ing','add , leading to a loss of enjoyment'],['Only by + -ing','solution: Only by + -ing + can coaches …']],\n  ['Pressure to win is what drives …, leading to …','Only by focusing on … can coaches …']],\n ['Food','Fast food is cheap and quick. People eat too much of it. Many get ill. Governments should teach cooking at school.','\u003cb>While\u003c/b> fast food is cheap and quick, \u003cb>overconsumption\u003c/b> of it harms health. \u003cb>It is cooking skills that\u003c/b> many people lack, so schools should teach them.',['While','Nominalisation','It-cleft'],\n  [['While','contrast the benefit and the problem: While + clause, …'],['Nominalisation','eat too much → overconsumption'],['It-cleft','solution: It is cooking skills that … lack']],\n  ['While fast food is …, overconsumption of it …','It is cooking skills that …']],\n ['Culture','Theatre tickets are expensive for students. Many students never go. They miss live performances. Theatres should offer student prices.','\u003cb>Theatre tickets, which\u003c/b> are expensive for students, are often avoided by young people, \u003cb>leaving\u003c/b> them without access to live performance. \u003cb>Were theatres to offer\u003c/b> student prices, more young people would attend.',['Non-defining clause','Result -ing','Inverted conditional'],\n  [['Non-defining clause','Theatre tickets, which …, are often avoided by young people'],['Result -ing',', leaving them without …'],['Inverted conditional','solution: Were theatres to + verb, more young people would …']],\n  ['Theatre tickets, which are expensive …, are avoided …','Were theatres to offer student prices, …']],\n ['Travel','Cheap flights are popular. They damage the environment. Tourists do not think about it. Airlines should show the carbon cost.','\u003cb>Despite the popularity\u003c/b> of cheap flights, \u003cb>little do\u003c/b> many tourists realise how much damage they cause. \u003cb>What airlines should do is\u003c/b> show the carbon cost of every ticket.',['Despite','Little do','What-cleft'],\n  [['Despite','Despite + noun phrase (popular → the popularity of)'],['Little do','Little do + subject + realise …'],['What-cleft','solution: What airlines should do is + verb …']],\n  ['Despite the popularity of …, little do many tourists …','What airlines should do is …']],\n ['Education and sleep','Teenagers stay up late. They are tired at school. Their grades fall. Schools should start later.','\u003cb>Having stayed up late\u003c/b>, many teenagers arrive at school exhausted, \u003cb>which\u003c/b> causes their grades to fall. \u003cb>What schools should do is\u003c/b> start lessons later.',['Having + past participle','Whole-idea relative clause','What-cleft'],\n  [['Having + past participle','Having stayed up late, many teenagers …'],[', which','add , which causes their grades to fall'],['What-cleft','solution: What schools should do is + verb']],\n  ['Having stayed up late, many teenagers …','What schools should do is …']],\n ['Cities','Cities are hot in summer. Concrete holds heat. People get ill. Cities should plant more trees.','\u003cb>Concrete, which\u003c/b> holds heat, makes cities unbearably hot in summer, \u003cb>causing\u003c/b> serious health problems. \u003cb>The reason why\u003c/b> trees help \u003cb>is that\u003c/b> they provide shade and cool the air.',['Non-defining clause','Result -ing','The reason why … is that'],\n  [['Non-defining clause','Concrete, which holds heat, makes cities …'],['Result -ing',', causing serious health problems'],['The reason why … is that','solution: The reason why trees help is that …']],\n  ['Concrete, which holds heat, makes cities …, causing …','The reason why trees help is that …']],\n ['Languages','Many adults want to learn a language. They have no time. They give up. Apps can help them.','\u003cb>Not having\u003c/b> enough time, many adults give up learning a language. \u003cb>What apps offer is\u003c/b> short daily lessons, \u003cb>which\u003c/b> fit even a busy schedule.',['Not + -ing','What-cleft','Non-defining which'],\n  [['Not + -ing','Not having enough time, many adults …'],['What-cleft','What apps offer is + noun phrase'],[', which','add , which fit even a busy schedule']],\n  ['Not having enough time, many adults …','What apps offer is …, which …']],\n ['Community','Young people want to help their communities. They do not know how. Charities do not advertise. Charities should visit schools.','\u003cb>Willingness to help\u003c/b> is widespread among young people. \u003cb>What they lack is\u003c/b> information, and \u003cb>only when\u003c/b> charities visit schools \u003cb>will\u003c/b> they know where to start.',['Nominalisation','What-cleft','Only when + inversion'],\n  [['Nominalisation','want to help → Willingness to help is …'],['What-cleft','What they lack is + information'],['Only when','solution: Only when charities … will they …']],\n  ['Willingness to help is widespread …','What they lack is …, and only when charities … will they …']],\n ['Rivers','Factories dump waste in rivers. Fish die in large numbers. Local people cannot swim there. The government should fine the factories.','\u003cb>Waste is dumped\u003c/b> in rivers by factories, and fish \u003cb>have been killed\u003c/b> in large numbers, \u003cb>with local people being unable\u003c/b> to swim there. \u003cb>It is widely believed that\u003c/b> factories should be fined.',['Passive','Perfect passive','Reporting passive'],\n  [['Passive','Waste is dumped in rivers by factories'],['Perfect passive','fish have been killed in large numbers'],['Reporting passive','solution: It is widely believed that factories should be …']],\n  ['Waste is dumped in rivers …, and fish have been …','It is widely believed that factories should be …']],\n];\nconst CL=[\n ['A local baker started the neighbourhood food festival.','It-cleft: focus on the person','It was a local baker who started the neighbourhood food festival.','It was a local baker that started the neighbourhood food festival.','Who (or that) for people.'],\n ['The first modern Olympic Games took place in 1896.','It-cleft: focus on the time','It was in 1896 that the first modern Olympic Games took place.','It was 1896 when … is not correct: use that.','After the focus use that, not when.'],\n ['Jazz began in New Orleans.','It-cleft: focus on the place','It was in New Orleans that jazz began.','It was New Orleans that gave birth to jazz.','The focus can be a place.'],\n ['Heavy rain caused most of the damage, not the wind.','It-cleft with contrast','It was heavy rain, not the wind, that caused most of the damage.','It was not the wind but heavy rain that caused most of the damage.','Two ways to show contrast.'],\n ['Success in exams depends on regular revision, not on last-minute cramming.','It is not … but … that','It is not last-minute cramming but regular revision that leads to success in exams.','It is regular revision, not last-minute cramming, that leads to success in exams.','Correct a common belief.'],\n ['Customers return to a restaurant for the service rather than the decoration.','It is not … but … that','It is not the decoration but the service that makes customers return to a restaurant.','It is the service, not the decoration, that brings customers back to a restaurant.','X and Y are the same type of phrase.'],\n ['Small towns need affordable housing for young families.','What-cleft','What small towns need is affordable housing for young families.','Affordable housing for young families is what small towns need.','What + clause + is + focus.'],\n ['Governments should protect wetlands.','What-cleft with do','What governments should do is protect wetlands.','What governments must do is to protect wetlands.','No to after do … is (to is optional).'],\n ['Inventors often lack funding.','What-cleft','What inventors often lack is funding.','Funding is what inventors often lack.','What + clause + is + focus.'],\n ['Fair competition needs clear rules.','Reverse what-cleft','Clear rules are what fair competition needs.','What fair competition needs is clear rules.','Focus + are / is what + clause.'],\n ['Most travellers just want a clean room and a friendly welcome.','All-cleft','All that most travellers want is a clean room and a friendly welcome.','What most travellers want is simply a clean room and a friendly welcome.','All that = the only thing.'],\n ['Many shops close because rents in city centres are too high.','The reason why … is that','The main reason why many shops close is that rents in city centres are too high.','What makes many shops close is the high cost of rents in city centres.','In formal writing: is that.'],\n ['Bees are disappearing because pesticides poison them.','The reason why … is that','The main reason why bees are disappearing is that pesticides poison them.','It is pesticides that are poisoning bees and making them disappear.','Reason cleft: is that + clause.'],\n ['Find and fix: It is the climate what makes this region ideal for wine.','Find and fix','It is the climate that makes this region ideal for wine.','It is the climate which makes this region ideal for wine.','Use that (or who for people), never what.'],\n ['Find and fix: The reason why many students feel stressed is because they have too much homework.','Find and fix','The reason why many students feel stressed is that they have too much homework.','Many students feel stressed because they have too much homework.','Avoid “is because” in formal writing.'],\n ['Find and fix: What many farmers need are cheaper fertiliser.','Find and fix','What many farmers need is cheaper fertiliser.','Cheaper fertiliser is what many farmers need.','The focus is uncountable, so use is.']\n];\nconst KEY='mix-state-v3';\nlet S={done:{},text:{},tab:'t1',filter:'all'};\nlet storageOK=true;\ntry{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){storageOK=false}\nfunction persist(){try{localStorage.setItem(KEY,JSON.stringify(S));$('#save').textContent='Saved on this device ✓'}catch(e){storageOK=false;$('#save').textContent='Auto-save is off. Use “Copy all my answers”.'}}\n/* build item lists */\nconst ORDER=['cond','conc','part','rel','nom','cleft1','cleft2','cleft3','inv1','inv2','pas'];\nconst T1=[];\nfor(let i=0;i\u003c4;i++)ORDER.forEach(k=>{const r=G[k][i];T1.push({id:'g-'+k+'-'+i,fam:k.replace(/\\d/,''),s:r[0],hint:r[1],model:r[2],alt:r[3],note:r[4]})});\nconst T2=MX.map((r,i)=>({id:'m-'+i,fam:r[2],fam2:r[4],s:r[0],model:r[1],alt:r[3],note:r[5]}));\nconst T4=CL.map((r,i)=>({id:'c-'+i,fam:'cleft',s:r[0],hint:r[1],model:r[2],alt:r[3],note:r[4]}));\nconst T3=PP.map((r,i)=>({id:'p-'+i,topic:r[0],s:r[1],model:r[2],structs:r[3],plan:r[4],starts:r[5]}));\nconst TABS={\n t1:{name:'1 · Guided',sub:'each task names the structure',items:T1,how:'\u003cb>How it works.\u003c/b> Read the simple sentence (Band 5–6). The orange pill tells you which structure to use. Write your sentence in the box, then open the model and compare.'},\n t2:{name:'2 · Mixed',sub:'choose from 2 suggested structures',items:T2,how:'\u003cb>Guided choice.\u003c/b> Each task suggests two structures that fit well. Choose one and write your sentence. The formulas are under the pill. Your idea can be different from the model, so check the grammar, not only the words.'},\n t4:{name:'4 · Cleft Lab',sub:'extra cleft practice',items:T4,how:'\u003cb>Cleft Lab.\u003c/b> Extra practice for cleft sentences: It-clefts, What-clefts, not … but, reason clefts and error correction. The orange pill names the structure to use.'},\n t3:{name:'3 · Paragraphs',sub:'upgrade a whole paragraph',items:T3,how:'\u003cb>Paragraph upgrade.\u003c/b> Rewrite the four short sentences as two or three longer ones. Follow the \u003cb>plan\u003c/b>: it tells you which structure to use for each idea. Open the sentence starters if you need a first step.'}\n};\nconst CHECK=['I used a structure from the course, and it is grammatically correct','Word order, auxiliaries and commas are right','The meaning is the same as the original'];\nfunction esc(t){return String(t).replace(/[&\u003c>\"]/g,c=>({'&':'&amp;','\u003c':'&lt;','>':'&gt;','\"':'&quot;'}[c]))}\nfunction total(){return T1.length+T2.length+T3.length+T4.length}\nfunction doneN(items){return items.filter(x=>S.done[x.id]).length}\nfunction renderTabs(){\n  $('#tabs').innerHTML=Object.keys(TABS).map(k=>`\u003cbutton class=\"tab${S.tab===k?' on':''}\" data-t=\"${k}\">${TABS[k].name}\u003csmall>${doneN(TABS[k].items)} / ${TABS[k].items.length} · ${TABS[k].sub}\u003c/small>\u003c/button>`).join('');\n  $('#how').innerHTML=TABS[S.tab].how;\n  const f=(S.tab==='t3'||S.tab==='t4')?'':['all',...Object.keys(FAM)].map(k=>`\u003cbutton class=\"chip${S.filter===k?' on':''}\" data-f=\"${k}\">${k==='all'?'All structures':FAM[k]}\u003c/button>`).join('');\n  $('#chips').innerHTML=f;\n}\nfunction card(x,i){\n  const d=!!S.done[x.id];\n  let top;\n  if(S.tab==='t3')top=`\u003cdiv class=\"src-l\">Band 5–6 paragraph · ${esc(x.topic)}\u003c/div>\u003cdiv class=\"src\">${esc(x.s)}\u003c/div>\u003cdiv class=\"plan\">\u003ch4>Your plan\u003c/h4>\u003col>${x.plan.map(p=>`\u003cli>\u003cb>${esc(p[0])}:\u003c/b> ${esc(p[1])}\u003c/li>`).join('')}\u003c/ol>\u003c/div>\u003cdetails class=\"st\">\u003csummary>Need sentence starters?\u003c/summary>\u003cul>${x.starts.map(t=>`\u003cli>${esc(t)}\u003c/li>`).join('')}\u003c/ul>\u003c/details>`;\n  else if(S.tab==='t2'){const fs=[x.fam,x.fam2].filter((v,i,a)=>a.indexOf(v)===i).sort((p,q)=>FAM[p].localeCompare(FAM[q]));top=`\u003cdiv class=\"src-l\">Band 5–6\u003c/div>\u003cdiv class=\"src\">${esc(x.s)}\u003c/div>\u003cspan class=\"hint\">Try: ${fs.map(k=>FAM[k]).join(' or ')}\u003c/span>\u003cdiv class=\"forms\">${fs.map(k=>`\u003cdiv>\u003cb>${FAM[k]}\u003c/b>: ${esc(FORM[k])}\u003c/div>`).join('')}\u003c/div>`}\n  else top=`\u003cdiv class=\"src-l\">Band 5–6\u003c/div>\u003cdiv class=\"src\">${esc(x.s)}\u003c/div>`+((S.tab==='t1'||S.tab==='t4')?`\u003cspan class=\"hint\">Use: ${esc(x.hint)}\u003c/span>`:'');\n  let model;\n  if(S.tab==='t3')model=`\u003cdiv class=\"ml\">Model · Band 7+\u003c/div>\u003cdiv class=\"mt\">${x.model}\u003c/div>\u003cdiv class=\"tags\">${x.structs.map(t=>`\u003cspan class=\"tg\">${esc(t)}\u003c/span>`).join('')}\u003c/div>`;\n  else{\n    const tags=S.tab==='t2'?`\u003cdiv class=\"tags\">\u003cspan class=\"tg\">Model: ${FAM[x.fam]}\u003c/span>\u003cspan class=\"tg\">Version 2: ${FAM[x.fam2]}\u003c/span>\u003c/div>`:'';\n    model=`\u003cdiv class=\"ml\">Model · Band 7+\u003c/div>\u003cdiv class=\"mt\">${x.model}\u003c/div>\u003cdiv class=\"alt\">Or: ${x.alt}\u003c/div>${tags}\u003cdiv class=\"note\">${esc(x.note)}\u003c/div>`;\n  }\n  return `\u003cdiv class=\"card${d?' done':''}${x.fam?' f-'+x.fam:''}\" data-id=\"${x.id}\">\u003cdiv class=\"head\">\u003cdiv class=\"num\">${i+1}\u003c/div>\u003cdiv>${top}\u003c/div>\u003c/div>\n  \u003ctextarea data-ta=\"${x.id}\" placeholder=\"${S.tab==='t3'?'Write your upgraded paragraph here…':'Write your sentence here…'}\" rows=\"${S.tab==='t3'?5:2}\">${esc(S.text[x.id]||'')}\u003c/textarea>\n  \u003cdiv class=\"row\">\u003cbutton class=\"btn\" data-a=\"model\">Show model\u003c/button>\u003cbutton class=\"btn ghost done${d?' on':''}\" data-a=\"done\">${d?'✓ Done':'Mark as done'}\u003c/button>\u003c/div>\n  \u003cdiv class=\"model\">${model}\u003c/div>\n  \u003cdiv class=\"sc\">\u003ch4>Self-check\u003c/h4>${CHECK.map(c=>`\u003clabel>\u003cinput type=\"checkbox\"> ${c}\u003c/label>`).join('')}\u003c/div>\u003c/div>`;\n}\nfunction render(){\n  renderTabs();\n  $('#remb').innerHTML=Object.keys(FAM).map(k=>`\u003cdiv>\u003cb>${FAM[k]}\u003c/b>: ${esc(FORM[k])}\u003c/div>`).join('');\n  let items=TABS[S.tab].items;\n  if(S.tab!=='t3'&&S.filter!=='all')items=items.filter(x=>x.fam===S.filter||x.fam2===S.filter);\n  $('#board').innerHTML=items.length?items.map((x,i)=>card(x,i)).join(''):'\u003cdiv class=\"empty\">No tasks for this filter in this tab. Try another tab.\u003c/div>';\n  progress();\n}\nfunction progress(){\n  const n=Object.keys(S.done).filter(k=>S.done[k]).length;\n  $('#fill').style.width=(n/total()*100)+'%';$('#lab').textContent=n+' / '+total();\n  const tabs=document.querySelectorAll('.tab');\n  Object.keys(TABS).forEach((k,i)=>{if(tabs[i])tabs[i].querySelector('small').textContent=doneN(TABS[k].items)+' / '+TABS[k].items.length+' · '+TABS[k].sub});\n}\ndocument.addEventListener('click',e=>{\n  const t=e.target.closest('[data-t]');if(t){S.tab=t.dataset.t;persist();render();return}\n  const f=e.target.closest('[data-f]');if(f){S.filter=f.dataset.f;persist();render();return}\n  const b=e.target.closest('[data-a]');\n  if(b){\n    const c=b.closest('.card'),id=c.dataset.id;\n    if(b.dataset.a==='model'){const m=c.querySelector('.model'),sc=c.querySelector('.sc');const sh=!m.classList.contains('show');m.classList.toggle('show',sh);sc.classList.toggle('show',sh);b.textContent=sh?'Hide model':'Show model'}\n    else{S.done[id]=!S.done[id];c.classList.toggle('done',S.done[id]);b.classList.toggle('on',S.done[id]);b.textContent=S.done[id]?'✓ Done':'Mark as done';persist();progress()}\n  }\n});\ndocument.addEventListener('input',e=>{if(e.target.matches('textarea[data-ta]')){S.text[e.target.dataset.ta]=e.target.value;persist()}});\n$('#copy').addEventListener('click',()=>{\n  const all=[...T1.map(x=>['Guided',x]),...T2.map(x=>['Mixed',x]),...T3.map(x=>['Paragraph',x]),...T4.map(x=>['Cleft Lab',x])];\n  const out=['Mixed Grammar Practice: my answers',''];\n  all.forEach(([k,x])=>{const a=(S.text[x.id]||'').trim();if(a){out.push(k+' · '+x.s);out.push('→ '+a);out.push('')}});\n  const txt=out.join('\\n');\n  const ok=()=>{$('#msg').textContent='Copied. Paste it into your homework.'};\n  const fb=()=>{const ta=document.createElement('textarea');ta.value=txt;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');ok()}catch(_){$('#msg').textContent='Copy failed. Select your answers manually.'}ta.remove()};\n  if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(txt).then(ok,fb);else fb();\n});\nlet rs=false;\n$('#reset').addEventListener('click',()=>{\n  if(!rs){rs=true;$('#reset').textContent='Click again to erase everything';setTimeout(()=>{rs=false;$('#reset').textContent='Start again'},4000);return}\n  S={done:{},text:{},tab:S.tab,filter:'all'};persist();rs=false;$('#reset').textContent='Start again';render();$('#msg').textContent='';\n});\nif(!storageOK)$('#save').textContent='Auto-save is off here. Use “Copy all my answers”.';\nrender();\n\u003c/script>\n\u003c/body>\n\u003c/html>\n"};
const TABS=[["conditionals", "Conditionals", "cond"], ["concession", "Concession", "conc"], ["participles", "Participles", "part"], ["relative", "Relative clauses", "rel"], ["nominalisation", "Nominalisation", "nom"], ["cleft", "Cleft sentences", "cleft"], ["inversion-1", "Inversion 1", "inv"], ["inversion-2", "Inversion 2", "inv2"], ["passive", "Passive voice", "pas"], ["mixed", "Mixed practice", "mix"]];
const rail=document.getElementById('rail'),stage=document.getElementById('stage'),load=document.getElementById('load');

    const f=document.createElement('iframe');f.title=t[1];f.setAttribute('allow','clipboard-write');
    f.addEventListener('load',()=>{sync(f);load.hidden=true});
    f.srcdoc=L[id];stage.appendChild(f);frames[id]=f;load.hidden=false;
  } else {load.hidden=true}
  frames[id].classList.add('on');

}
TABS.forEach(t=>{

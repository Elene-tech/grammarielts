area{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;max-width:100%}\ninput[type=text]{border-bottom:2px solid var(--teal);min-height:40px;font-family:var(--f-m);font-size:18px}\nselect{min-height:40px}\ntextarea{width:100%;resize:vertical;line-height:1.5}\n.hint{font:500 17px var(--f-m);color:var(--warn);background:var(--warn-soft);padding:2px 9px;border-radius:4px;margin-left:8px;white-space:nowrap}\n.btn{font:500 16px var(--f-b);background:var(--teal);color:var(--on);border:1px solid var(--teal);border-radius:6px;padding:8px 16px;cursor:pointer}\n.btn.ghost{background:transparent;color:var(--teal);border-color:var(--teal)}\n.btn.sm{padding:6px 12px;font-size:15px}\n.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}\n.sum{font:400 15px var(--f-m);color:var(--muted)}\n.si textarea{margin:6px 0}\n.plain{margin-bottom:4px}\n.use{display:inline-block;font:500 16px var(--f-m);color:var(--warn);background:var(--warn-soft);padding:3px 11px;border-radius:4px;margin-bottom:6px}\n.model{background:var(--teal-soft);border-radius:6px;padding:12px 14px;margin-top:8px;font-size:17px}\n.model p{margin:0 0 6px}\n.note{font-size:15px;color:var(--muted)}\n.nudge{font-size:15px;color:var(--warn);margin:4px 0 0}\n.rate{display:inline-flex;gap:6px;flex-wrap:wrap}\n\n/* teaching components */\n.map{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:22px}\n.map div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line)}\n.map div:first-child{border-top:0}\n.map b{font-weight:600}.map span{font:500 16px var(--f-m);color:var(--teal)}\n.tblh{font:500 13px/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}\n.tbl{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.grp{font:500 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--bg);padding:10px 16px;border-top:1px solid var(--line)}\n.grp:first-child{border-top:0}\n.tr{display:grid;grid-template-columns:190px minmax(0,1fr);gap:6px 22px;padding:16px;border-top:1px solid var(--line)}\n.tr>div{min-width:0}\n.tr .st{font:600 20px/1.25 var(--f-d);grid-row:1/span 4}\n.tr .fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}\n.tr .fm .c1,.tr .fm .c2{font:500 16px/1.4 var(--f-m);padding:6px 11px;border-radius:6px;color:var(--fg)}\n.tr .fm .c1{background:var(--teal-soft);border:1px solid var(--teal)}\n.tr .fm .c2{background:var(--gold-soft);border:1px solid var(--gold)}\n.tr .fm .sep{font:500 20px var(--f-m);color:var(--muted)}\n.tr .uj{font-size:16px;color:var(--muted)}\n.tr .exs{font-size:17.5px}\n.tr .wo{font-size:16px;color:var(--warn)}\n.tr b{background:var(--mark);font-weight:500;padding:0 2px;border-radius:2px}\n.tr .wo b,.tr .uj b{color:var(--fg)}\n.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;margin:0 0 10px}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}\n\n/* section accents: each part of the lesson has its own colour */\n#s-w{--acc:var(--a-w)}#s-i{--acc:var(--a-i)}#s-p{--acc:var(--a-p)}#s-r{--acc:var(--a-r)}#s-v{--acc:var(--a-v)}#s-o{--acc:var(--a-o)}#s-e{--acc:var(--a-e)}#s-s{--acc:var(--a-s)}#s-x{--acc:var(--a-x)}\n.sec{--acc:var(--teal)}\n.time{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.sec-h h2{border-left:5px solid var(--acc);padding-left:12px}\n.ex{border-top:4px solid var(--acc)}\n.ex>h3{color:var(--acc)}\n.sec.stretch .time{color:var(--acc);border-color:var(--acc)}\n.model{background:color-mix(in srgb,var(--acc) 13%,var(--surface));border-left:4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n.flip .no{background:var(--bad-bg);border-color:var(--bad)}\n.flip small b{font-weight:500}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar\u003c/p>\n  \u003ch1>Participles in Task 2\u003c/h1>\n  \u003cp class=\"sub\">Replace “because”, “so” and “and this” with participle phrases. Shorter, denser, Band 7+.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Task 2 · Opinion · Discuss both views · Task 1 overviews\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: shorter, denser sentences\u003c/h2>\u003cp class=\"lead\">A participle phrase packs a whole idea into a few words. It replaces a clause, so your sentence is shorter and sounds more academic.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Why it matters\u003c/h3>\n    \u003cp>Band 6 writers use \u003cb>because\u003c/b>, \u003cb>so\u003c/b> and \u003cb>and this\u003c/b> again and again. Band 7+ writers sometimes replace them with a participle phrase.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Band 6\u003c/small>Many athletes train for years \u003cb>and\u003c/b> they have little time for a social life.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Band 7+\u003c/small>\u003cb>Training\u003c/b> for years, many athletes have little time for a social life.\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tblh\">Reference table: five structures\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>the participle phrase\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>the main clause\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>The “same subject” rule\u003c/h3>\n    \u003cp>The participle phrase has no subject of its own. It borrows the subject of the main clause. Ask: \u003cb>who does the action?\u003c/b>\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv class=\"no\">\u003csmall>Not this\u003c/small>\u003cb>Having won the match\u003c/b>, the celebrations lasted all night.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>This\u003c/small>\u003cb>Having won the match\u003c/b>, the players celebrated all night.\u003c/div>\u003c/div>\n    \u003cp class=\"note\">In the first sentence it sounds as if the celebrations won the match. Examiners call this a “dangling participle”. It is the most common mistake with this structure.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>See the upgrade\u003c/h3>\u003cdiv id=\"up\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by structure\u003c/h3>\u003cp class=\"task\">Which structure does each sentence use?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: recognise it, then write it yourself\u003c/h2>\u003cp class=\"lead\">Five steps: check, choose, type, combine, rewrite.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Same subject? Check the sentence\u003c/h3>\u003cp class=\"task\">Is the sentence correct? Ask who does the action in the first part.\u003c/p>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Choose the best answer\u003c/h3>\u003col class=\"qs\" id=\"m-pb\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Type the missing word\u003c/h3>\u003cp class=\"task\">Write the correct form of the verb in brackets.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Combine the sentences\u003c/h3>\u003cp class=\"task\">Join each pair into one Band 7+ sentence with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>E · From clause to participle\u003c/h3>\u003cp class=\"task\">Rewrite each sentence with a participle phrase. Keep the meaning. Tip: copy your three best sentences by hand into your notebook.\u003c/p>\u003cdiv id=\"m-pe\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: the structure at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Discuss both views · compulsory school sport\u003c/h3>\n    \u003cdiv class=\"read\">Some people believe that schools should make sport compulsory. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Freed from desks for an hour, pupils return to lessons more alert.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Having played team games, many children learn to cooperate and accept defeat.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Lessons are also cheap to run, allowing schools to offer sport to every pupil.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>When taught well, sport builds confidence as well as fitness.\u003c/mark> However, forcing unwilling pupils to compete can reduce their enjoyment. For these reasons, schools should offer a wide choice of activities.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Task 1 · smartphone and tablet sales (sample data)\u003c/h3>\n    \u003cdiv class=\"read\">The graph shows annual sales of smartphones and tablets in one country from 2010 to 2020. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Starting at 2 million units, smartphone sales rose steadily to reach 14 million in 2020.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Tablet sales peaked at 6 million in 2015, falling to 4 million by 2020.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Compared with tablets, smartphones were far more popular throughout the decade.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Having overtaken tablets in 2011, smartphones kept their lead until the end.\u003c/mark> Overall, smartphones became far more popular than tablets.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: ready-made chunks\u003c/h2>\u003cp class=\"lead\">These phrases often come after a comma or at the start of a sentence. Learn them as chunks.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. Use each phrase once.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: your own sentences\u003c/h2>\u003cp class=\"lead\">Write single sentences first, then a short paragraph.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Write your own sentence\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different structures from today.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n  \u003cp class=\"note\">Next lesson: Relative clauses (who, which, whose, and reduced relatives).\u003c/p>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Join with a result -ing\u003c/h3>\u003cp class=\"task\">Join each pair into one sentence. Use a participle after a comma instead of “This …”.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence has a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Start with a past participle\u003c/h3>\u003cp class=\"task\">Rewrite each sentence. Start with a past participle phrase such as Faced with, Given or Left.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Participles in Task 2. Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='part-state-v2';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Participles in Task 2: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={result:'Result -ing',reason:'Reason -ing',having:'Having + past participle',past:'Past participle opener',conj:'Conjunction + participle'};\nfunction detect(t){\n  const x=t.replace(/\\r/g,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  if(/,\\s+(?!including|according|depending|during)[a-z]+ing\\b/i.test(x))s.add('result');\n  if(/(^|[.!?]\\s+)(not\\s+)?[A-Za-z]+ing\\b[^.?!]*,/i.test(x)&&!/(^|[.!?]\\s+)having\\b/i.test(x)||/(^|[.!?]\\s+)(not\\s+)?(?!having)[a-z]+ing\\b[^.?!]*,/i.test(x))s.add('reason');\n  if(/\\bhaving\\s+(been\\s+)?[a-z]+(ed|en|t|n|ne)\\b/i.test(x))s.add('having');\n  if(/(^|[.!?]\\s+)(faced|given|used|compared|left|freed|powered|[a-z]+ed)\\b[^.?!]*,/i.test(x)&&!/(^|[.!?]\\s+)(the|a|an|many|some|most|these|those|this|that|there)\\b/i.test(x.split(/[.!?]/).find(z=>/(faced|given|used|compared|left|freed|powered)/i.test(z))||''))s.add('past');\n  if(/\\b(when|while|if|once|unless|before|after)\\s+(used|left|given|managed|compared|faced|[a-z]+ing)\\b/i.test(x))s.add('conj');\n  const warns=[];\n  if(/,\\s+(leads|results|causes|makes|creates)\\b/i.test(x))warns.push('After a comma use an -ing form: leading, resulting, causing, making.');\n  if(/\\bhaving\\s+(go|do|see|take|make|have|finish|lose|spend|work|study|use|try)\\b/i.test(x))warns.push('After Having use a past participle: Having finished, Having lost.');\n  if(/\\b(used|using)\\s+wise\\b/i.test(x))warns.push('Use an adverb: used wisely.');\n  if(/,\\s+(and|but)\\s+[a-z]+ing\\b/i.test(x))warns.push('Do not put and or but before an -ing phrase.');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst STRUCT=['Result -ing','Reason -ing','Having + past participle','Past participle opener','Conjunction + participle'];\nconst TBL=[\n ['Present participle (-ing)'],\n ['Result -ing','~Main clause, -ing phrase','Show the result of the first idea. Use leading to, resulting in, causing, making, allowing','Sports clubs have raised ticket prices, \u003cb>keeping\u003c/b> many young fans away from stadiums.','After a comma use -ing, not “leads”. The -ing phrase describes the whole first idea.'],\n ['Reason -ing','-ing phrase, main clause','Give the reason or the situation at the start of the sentence. Not + -ing for the negative','\u003cb>Training\u003c/b> for years, many athletes have little time for a normal social life. / \u003cb>Not knowing\u003c/b> the rules, new fans often feel lost at matches.','Same subject in both parts. Ask: who lives? who knows?'],\n ['Perfect participle'],\n ['Having + past participle','Having + past participle, main clause','The first action finished BEFORE the second one','\u003cb>Having reached\u003c/b> the final, the team trained twice a day.','Having + past participle only. Never “Having lose”. Same subject in both parts.'],\n ['Past participle (passive meaning)'],\n ['Past participle opener','Past participle phrase, main clause','The subject receives the action: it is faced, given, left, used. Good with adverbs','\u003cb>Faced\u003c/b> with rising costs, many sports clubs raise prices. / \u003cb>Used\u003c/b> wisely, fitness apps can motivate beginners.','Say “Used wisely”, not “Using wisely”. The subject does NOT do the action.'],\n ['Conjunction + participle','When / While / If + participle, main clause','Keep the conjunction to make the link clear','\u003cb>When used\u003c/b> regularly, fitness trackers can improve training.','Works with when, while, if, once, unless. The subject must match the main clause.']\n];\nconst UP=[\n ['Result -ing','Fashion trends change quickly. This creates huge amounts of textile waste.','Fashion trends change quickly, creating huge amounts of textile waste.'],\n ['Reason -ing','Many astronauts spend months in space. They lose muscle strength.','Spending months in space, many astronauts lose muscle strength.'],\n ['Having + past participle','Scientists have discovered a new planet. They are now studying its atmosphere.','Having discovered a new planet, scientists are now studying its atmosphere.'],\n ['Past participle opener','Shoppers are given many choices. They often feel confused.','Given many choices, shoppers often feel confused.'],\n ['Conjunction + participle','If it is practised regularly, a language can be learnt faster.','If practised regularly, a language can be learnt faster.']\n];\nconst BANKS=[\n ['Result phrases (after a comma)',[['leading to + noun','one thing causes another'],['resulting in + noun','the final outcome'],['contributing to + noun','helping to cause'],['putting pressure on + noun','creating stress for'],['making it harder to + verb','creating a difficulty'],['allowing people to + verb','giving the chance']]],\n ['Participle openers',[['Faced with + noun','having to deal with'],['Given + noun','if someone gets or has'],['Compared with + noun','looking at the difference'],['Having + past participle','after doing something'],['Used wisely / responsibly','when we use it well'],['Left unchecked','if nobody controls it']]],\n ['Science and space',[['astronaut','a person trained for space travel'],['orbit','the path around a planet'],['experiment','a test to find something out'],['breakthrough','an important new discovery'],['gravity','the force that pulls things down'],['research funding','money for scientific work']]]\n];\nfunction build(){\n  Object.keys(ST).forEach(k=>delete ST[k]);\n  const W=[\n   ['Having tested the new vaccine, results were published by the scientists.',['Having tested the new vaccine, the scientists published the results.','Having tested the new vaccine, results were published by the scientists.','Having test the new vaccine, the scientists published the results.'],'The scientists tested and published, so \u003cb>the scientists\u003c/b> must be the subject of the main clause.'],\n   ['Fashion prices have fallen, result in more waste.',['Fashion prices have fallen, resulting in more waste.','Fashion prices have fallen, result in more waste.','Fashion prices have fallen, resulted in more waste.'],'After a comma use \u003cb>-ing\u003c/b>: resulting.'],\n   ['Launching in 2019, the app has become popular.',['Launched in 2019, the app has become popular.','Launching in 2019, the app has become popular.','Launch in 2019, the app has become popular.'],'The app does not launch itself. It is launched, so use the \u003cb>past participle\u003c/b>.'],\n   ['Have trained for months, the athletes felt confident.',['Having trained for months, the athletes felt confident.','Have trained for months, the athletes felt confident.','Training for months before, the athletes felt confident.'],'Use \u003cb>Having + past participle\u003c/b> for an earlier action.'],\n   ['Practised regular, a new language becomes easier.',['Practised regularly, a new language becomes easier.','Practised regular, a new language becomes easier.','Practising regularly, a new language becomes easier.'],'Use an adverb: \u003cb>regularly\u003c/b>. A language is practised, so use the past participle.'],\n   ['Knowing not how to swim, many tourists avoid the sea.',['Not know round:var(--teal-soft)}\n.fb.ok{background:var(--ok-bg);color:var(--ok)}.fb.bad{background:var(--bad-bg);color:var(--bad)}\n.gi{padding:8px 10px;border:1px solid transparent;border-radius:6px}\n.gi.ok{background:var(--ok-bg);border-color:var(--ok)}.gi.bad{background:var(--bad-bg);border-color:var(--bad)}\n.gi .fb{background:transparent;padding:4px 0 0;margin:0;color:inherit}\nselect,input[type=text],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:5px;padding:5px 8px;max-width:100%}\ninput[type=text]{border-bottom:2px solid var(--teal);min-height:40px;font-family:var(--f-m);font-size:18px}\nselect{min-height:40px}\ntextarea{width:100%;resize:vertical;line-height:1.5}\n.hint{font:500 17px var(--f-m);color:var(--warn);background:var(--warn-soft);padding:2px 9px;border-radius:4px;margin-left:8px;white-space:nowrap}\n.btn{font:500 16px var(--f-b);background:var(--teal);color:var(--on);border:1px solid var(--teal);border-radius:6px;padding:8px 16px;cursor:pointer}\n.btn.ghost{background:transparent;color:var(--teal);border-color:var(--teal)}\n.btn.sm{padding:6px 12px;font-size:15px}\n.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:14px}\n.sum{font:400 15px var(--f-m);color:var(--muted)}\n.si textarea{margin:6px 0}\n.plain{margin-bottom:4px}\n.use{display:inline-block;font:500 16px var(--f-m);color:var(--warn);background:var(--warn-soft);padding:3px 11px;border-radius:4px;margin-bottom:6px}\n.model{background:var(--teal-soft);border-radius:6px;padding:12px 14px;margin-top:8px;font-size:17px}\n.model p{margin:0 0 6px}\n.note{font-size:15px;color:var(--muted)}\n.nudge{font-size:15px;color:var(--warn);margin:4px 0 0}\n.rate{display:inline-flex;gap:6px;flex-wrap:wrap}\n\n/* teaching components */\n.map{display:grid;gap:0;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface);margin-bottom:22px}\n.map div{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px;padding:10px 14px;border-top:1px solid var(--line)}\n.map div:first-child{border-top:0}\n.map b{font-weight:600}.map span{font:500 16px var(--f-m);color:var(--teal)}\n.tblh{font:500 13px/1.3 var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin:22px 0 8px}\n.tbl{background:var(--surface);border:1px solid var(--line);border-radius:8px;overflow:hidden}\n.grp{font:500 13px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--teal);background:var(--bg);padding:10px 16px;border-top:1px solid var(--line)}\n.grp:first-child{border-top:0}\n.tr{display:grid;grid-template-columns:190px minmax(0,1fr);gap:6px 22px;padding:16px;border-top:1px solid var(--line)}\n.tr>div{min-width:0}\n.tr .st{font:600 20px/1.25 var(--f-d);grid-row:1/span 4}\n.tr .fm{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:4px}\n.tr .fm .c1,.tr .fm .c2{font:500 16px/1.4 var(--f-m);padding:6px 11px;border-radius:6px;color:var(--fg)}\n.tr .fm .c1{background:var(--teal-soft);border:1px solid var(--teal)}\n.tr .fm .c2{background:var(--gold-soft);border:1px solid var(--gold)}\n.tr .fm .sep{font:500 20px var(--f-m);color:var(--muted)}\n.tr .uj{font-size:16px;color:var(--muted)}\n.tr .exs{font-size:17.5px}\n.tr .wo{font-size:16px;color:var(--warn)}\n.tr b{background:var(--mark);font-weight:500;padding:0 2px;border-radius:2px}\n.tr .wo b,.tr .uj b{color:var(--fg)}\n.legend{display:flex;flex-wrap:wrap;gap:8px 18px;font-size:15px;margin:0 0 10px}\n.legend i{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:6px}\n\n/* section accents: each part of the lesson has its own colour */\n#s-w{--acc:var(--a-w)}#s-i{--acc:var(--a-i)}#s-p{--acc:var(--a-p)}#s-r{--acc:var(--a-r)}#s-v{--acc:var(--a-v)}#s-o{--acc:var(--a-o)}#s-e{--acc:var(--a-e)}#s-s{--acc:var(--a-s)}#s-x{--acc:var(--a-x)}\n.sec{--acc:var(--teal)}\n.time{color:var(--acc);border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.sec-h h2{border-left:5px solid var(--acc);padding-left:12px}\n.ex{border-top:4px solid var(--acc)}\n.ex>h3{color:var(--acc)}\n.sec.stretch .time{color:var(--acc);border-color:var(--acc)}\n.model{background:color-mix(in srgb,var(--acc) 13%,var(--surface));border-left:4px solid var(--acc)}\n.wordbank{border-color:var(--acc)}\n.wordbank span{background:color-mix(in srgb,var(--acc) 16%,var(--surface));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent)}\ninput[type=text]{border-bottom-color:var(--acc)}\n.opt:hover:not(:disabled){border-color:var(--acc);background:color-mix(in srgb,var(--acc) 12%,var(--surface))}\n.grp{color:var(--acc)}\n.chip[href=\"#s-w\"]{border-bottom:3px solid var(--a-w)}.chip[href=\"#s-i\"]{border-bottom:3px solid var(--a-i)}.chip[href=\"#s-p\"]{border-bottom:3px solid var(--a-p)}.chip[href=\"#s-r\"]{border-bottom:3px solid var(--a-r)}.chip[href=\"#s-v\"]{border-bottom:3px solid var(--a-v)}.chip[href=\"#s-o\"]{border-bottom:3px solid var(--a-o)}.chip[href=\"#s-e\"]{border-bottom:3px solid var(--a-e)}.chip[href=\"#s-s\"]{border-bottom:3px solid var(--a-s)}.chip[href=\"#s-x\"]{border-bottom:3px solid var(--a-x)}\n.qs>li::before{color:var(--acc);font-weight:500}\n.tr .st{color:var(--acc)}\n.pbar i{background:linear-gradient(90deg,var(--a-i),var(--a-p),var(--a-o))}\ntextarea#sheet{font:400 14px/1.5 var(--f-m);margin-top:8px}\n@media (max-width:760px){\n  .tr{grid-template-columns:1fr}.tr .st{grid-row:auto}\n  .map div{grid-template-columns:1fr;gap:2px}\n  .sec-h{grid-template-columns:1fr}.time{grid-row:auto;justify-self:start;margin:0}.lead{grid-column:1}\n}\n.flip{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:stretch;margin:14px 0 6px}\n.flip>div{padding:12px 14px;border-radius:6px;background:var(--bg);border:1px solid var(--line)}\n.flip small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}\n.flip .ar{display:flex;align-items:center;justify-content:center;border:0;background:none;padding:0;font:500 22px var(--f-m);color:var(--teal)}\n.flip .to{background:var(--teal-soft);border-color:var(--teal)}\n.flip .no{background:var(--bad-bg);border-color:var(--bad)}\n.flip small b{font-weight:500}\n@media (max-width:640px){.flip{grid-template-columns:1fr}.flip .ar{transform:rotate(90deg)}}\n.ladder{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:10px 0 0}\n.ladder>div{border-top:3px solid var(--line);padding:8px 0 0}\n.ladder>div:nth-child(2){border-color:var(--teal)}.ladder>div:nth-child(3){border-color:var(--gold)}\n.ladder small{display:block;font:500 11px var(--f-m);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}\n@media (max-width:640px){.ladder{grid-template-columns:1fr}}\n.steps{margin:10px 0 0;padding-left:1.2em}.steps li{margin-bottom:4px}\n.read{font-family:var(--f-d);font-size:20px;line-height:1.75;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px 20px;margin-bottom:14px}\n.read mark{background:var(--mark);color:var(--fg);padding:1px 2px;border-radius:2px}\n.read .tg{font:500 11px var(--f-m);background:var(--teal);color:var(--on);border-radius:3px;padding:0 4px;margin-right:4px;vertical-align:2px}\n.banks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-bottom:22px}\n.bank{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px}\n.bank h3{font-size:18px;margin-bottom:8px}\n.bank ul{list-style:none;margin:0;padding:0;font-size:16px}\n.bank li{padding:4px 0;border-top:1px dotted var(--line)}\n.bank li:first-child{border-top:0}\n.bank b{font-weight:600;color:var(--teal)}\n@media (max-width:700px){.banks{grid-template-columns:1fr}}\n.wordbank{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px;padding:10px;border:1px dashed var(--teal);border-radius:6px;font:400 16px var(--f-m)}\n.wordbank span{background:var(--teal-soft);padding:2px 8px;border-radius:4px}\n.seg{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}\n.segb{font:500 15px var(--f-b);background:var(--bg);color:var(--fg);border:1px solid var(--line);border-radius:999px;padding:5px 14px;cursor:pointer}\n.segb.on{background:var(--teal);border-color:var(--teal);color:var(--on)}\n.prompt{margin:0 0 10px;padding:10px 14px;background:var(--bg);border-left:3px solid var(--gold);font-family:var(--f-d);font-size:17px}\n.wmeta{display:flex;gap:14px;font:400 15px var(--f-m);margin-top:4px}\n.chk{list-style:none;margin:10px 0 0;padding:0;font-size:16px;display:grid;gap:3px}\n.chk li::before{content:\"○\";font-family:var(--f-m);margin-right:8px;color:var(--muted)}\n.chk li.y{color:var(--ok)}.chk li.y::before{content:\"✓\";color:var(--ok)}\n.chk li.w{color:var(--bad)}.chk li.w::before{content:\"!\";color:var(--bad)}\n.timer{display:flex;align-items:center;gap:12px;margin-bottom:8px}\n.clock{font:500 26px var(--f-m);color:var(--warn)}\n.review{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:20px}\n.review ul{margin:8px 0 0;padding-left:1.2em;columns:2;column-gap:28px}\n@media (max-width:600px){.review ul{columns:1}}\n.foot{padding-block:10px 40px;color:var(--muted);font-size:14px}\n@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}\n\u003c/style>\n\n\u003cheader class=\"hero\">\u003cdiv class=\"wrap\">\n  \u003cp class=\"kicker\">Target English · IELTS Grammar\u003c/p>\n  \u003ch1>Relative Clauses in Task 2\u003c/h1>\n  \u003cp class=\"sub\">Add detail to your nouns with who, which, whose and , which. Fewer short sentences, more Band 7+.\u003c/p>\n  \u003cul class=\"meta\">\u003cli>90 minutes\u003c/li>\u003cli>Writing Task 2\u003c/li>\u003cli>Discuss both views · Opinion · Advantages and disadvantages\u003c/li>\u003c/ul>\n\u003c/div>\u003c/header>\n\n\u003cdiv class=\"bar\">\u003cdiv class=\"wrap barin\">\n  \u003cdiv class=\"stats\">\u003cspan>Answered \u003cb id=\"st-a\">0/0\u003c/b>\u003c/span>\u003cspan>Correct first time \u003cb id=\"st-c\">0\u003c/b>\u003c/span>\u003cspan>Accuracy \u003cb id=\"st-p\">–\u003c/b>\u003c/span>\u003cspan class=\"sp\">\u003c/span>\u003cspan id=\"st-s\" class=\"muted\">\u003c/span>\u003cspan id=\"st-save\" class=\"muted\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"pbar\">\u003ci id=\"bar-f\">\u003c/i>\u003c/div>\n  \u003cnav class=\"chips\" id=\"chips\" aria-label=\"Lesson sections\">\u003c/nav>\n\u003c/div>\u003c/div>\n\n\u003cmain class=\"wrap\">\n\n\u003csection class=\"sec\" id=\"s-w\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">0–8 min\u003c/span>\u003ch2>Warm-up: spot the error\u003c/h2>\u003cp class=\"lead\">Each sentence has a mistake. Choose the corrected version. This shows you what to watch today.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Choose the correct sentence\u003c/h3>\u003col class=\"qs\" id=\"m-w\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-i\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">8–22 min\u003c/span>\u003ch2>Input: add detail without new sentences\u003c/h2>\u003cp class=\"lead\">A relative clause adds information to a noun. It lets you build one rich sentence instead of three short ones.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Why it matters\u003c/h3>\n    \u003cp>Band 6 essays use many short sentences. Band 7+ essays pack in more information with \u003cb>who\u003c/b>, \u003cb>which\u003c/b>, \u003cb>whose\u003c/b> and \u003cb>, which\u003c/b>.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Band 6\u003c/small>Some pensioners live alone. They often feel lonely.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Band 7+\u003c/small>Pensioners \u003cb>who live alone\u003c/b> often feel lonely.\u003c/div>\u003c/div>\n  \u003c/div>\n  \u003cp class=\"tblh\">Reference table: six structures\u003c/p>\n  \u003cdiv class=\"legend\">\u003cspan>\u003ci style=\"background:var(--teal-soft);border:1px solid var(--teal)\">\u003c/i>the noun you describe\u003c/span>\u003cspan>\u003ci style=\"background:var(--gold-soft);border:1px solid var(--gold)\">\u003c/i>the relative clause\u003c/span>\u003c/div>\n  \u003cdiv class=\"tbl\" id=\"tbl\">\u003c/div>\n  \u003cdiv class=\"ex\" style=\"margin-top:22px\">\u003ch3>Defining or non-defining?\u003c/h3>\n    \u003cp>\u003cb>Defining\u003c/b> clauses tell us \u003ci>which\u003c/i> people or things. There are no commas. \u003cb>Non-defining\u003c/b> clauses add extra information. They have commas, and you can delete them without changing the main message.\u003c/p>\n    \u003cdiv class=\"flip\">\u003cdiv>\u003csmall>Defining (no commas)\u003c/small>Pensioners \u003cb>who live alone\u003c/b> often feel lonely.\u003c/div>\u003cdiv class=\"ar\">→\u003c/div>\u003cdiv class=\"to\">\u003csmall>Non-defining (commas)\u003c/small>Japan\u003cb>, which has an ageing population,\u003c/b> spends heavily on elderly care.\u003c/div>\u003c/div>\n    \u003cp class=\"note\">Test: delete the clause. “Pensioners often feel lonely” changes the meaning, so it is defining. “Japan spends heavily on elderly care” still works, so it is non-defining.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>See the upgrade\u003c/h3>\u003cdiv id=\"up\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Sort by structure\u003c/h3>\u003cp class=\"task\">Which structure does each sentence use?\u003c/p>\u003cdiv id=\"m-i\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-p\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">22–40 min\u003c/span>\u003ch2>Practice: recognise it, then write it yourself\u003c/h2>\u003cp class=\"lead\">Five steps: check, choose, type, combine, rewrite.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Check the sentence\u003c/h3>\u003cp class=\"task\">Is the sentence correct? Look at the pronoun and the commas.\u003c/p>\u003col class=\"qs\" id=\"m-pa\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Choose the best answer\u003c/h3>\u003col class=\"qs\" id=\"m-pb\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>C · Type the missing word\u003c/h3>\u003cp class=\"task\">Write the correct relative pronoun. Sometimes more than one answer is possible.\u003c/p>\u003cdiv id=\"m-pc\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>D · Combine the sentences\u003c/h3>\u003cp class=\"task\">Join each pair into one Band 7+ sentence with the structure shown. Write first, then open the model.\u003c/p>\u003cdiv id=\"m-pd\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>E · Shorten the clause\u003c/h3>\u003cp class=\"task\">Rewrite each sentence as a reduced relative clause. Delete “who / that + is / are / was” and keep the participle. Tip: copy your three best sentences by hand into your notebook.\u003c/p>\u003cdiv id=\"m-pe\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-r\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">40–55 min\u003c/span>\u003ch2>Reading: the structure at work\u003c/h2>\u003cp class=\"lead\">Read two model paragraphs. Each highlighted sentence has a letter.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 1 · Discuss both views · funding for the arts\u003c/h3>\n    \u003cdiv class=\"read\">Some people think that governments should fund museums and theatres. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Cities which invest in culture attract more visitors and new businesses.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Public museums, which are often free to enter, give everyone access to art and history.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Artists whose work is not commercial depend on public support.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Exhibitions organised by local communities strengthen a sense of identity.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">E\u003c/span>The extent to which culture should be paid for by taxpayers is, however, a matter of debate.\u003c/mark> For these reasons, a balance of public and private funding is best.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r1\">\u003c/div>\u003col class=\"qs\" id=\"m-r1q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Text 2 · Task 1 · broadband use (line graph, sample data)\u003c/h3>\n    \u003cdiv class=\"read\">The line graph, which covers the period from 2000 to 2020, compares broadband use in two countries. \u003cmark>\u003cspan class=\"tg\">A\u003c/span>Country A, whose figure started at just 5%, rose steadily to 85%.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">B\u003c/span>Country B, which began with a higher figure of 20%, grew more slowly.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">C\u003c/span>Broadband use in Country B reached 70% in 2020, which was 15 points lower than in Country A.\u003c/mark> \u003cmark>\u003cspan class=\"tg\">D\u003c/span>Households connected after 2010 account for most of the growth in both countries.\u003c/mark> Overall, both countries recorded a large increase.\u003c/div>\n    \u003cp class=\"task\">Which structure is used in each highlighted sentence?\u003c/p>\u003cdiv id=\"m-r2\">\u003c/div>\u003col class=\"qs\" id=\"m-r2q\" style=\"margin-top:14px\">\u003c/ol>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-v\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">55–70 min\u003c/span>\u003ch2>Vocabulary: ready-made chunks\u003c/h2>\u003cp class=\"lead\">These phrases make your relative clauses sound natural and academic. Learn them as chunks.\u003c/p>\u003c/div>\n  \u003cdiv class=\"banks\" id=\"banks\">\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>Use the phrases\u003c/h3>\u003cp class=\"task\">Complete each sentence with a phrase from the box. Use each phrase once.\u003c/p>\u003cdiv class=\"wordbank\" id=\"wb-v\">\u003c/div>\u003cdiv id=\"m-v\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-o\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">70–85 min\u003c/span>\u003ch2>Production: your own sentences\u003c/h2>\u003cp class=\"lead\">Write single sentences first, then a short paragraph.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>A · Write your own sentence\u003c/h3>\u003cp class=\"task\">Write one sentence for each topic with the structure shown. Your sentence can be different from the model, so check the structure, not the words.\u003c/p>\u003cdiv id=\"m-oa\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>B · Write a paragraph\u003c/h3>\u003cp class=\"task\">Choose one question. Write 60–90 words and use at least two different structures from today.\u003c/p>\u003cdiv id=\"m-ob\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-e\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">85–90 min\u003c/span>\u003ch2>Exit ticket\u003c/h2>\u003cp class=\"lead\">Three quick questions to check what stayed with you.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003col class=\"qs\" id=\"m-e\">\u003c/ol>\u003c/div>\n  \u003cp class=\"note\">Remember: try to include one relative clause in every body paragraph.\u003c/p>\n\u003c/section>\n\n\u003csection class=\"sec stretch\" id=\"s-s\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Stretch\u003c/span>\u003ch2>Challenge for fast finishers\u003c/h2>\u003cp class=\"lead\">Optional. These tasks are harder and are not part of the main score.\u003c/p>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S1 · Join with whose\u003c/h3>\u003cp class=\"task\">Join each pair into one sentence with \u003cb>whose\u003c/b>.\u003c/p>\u003cdiv id=\"m-s1\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S2 · Find and fix\u003c/h3>\u003cp class=\"task\">Each sentence has a mistake. Write the corrected version.\u003c/p>\u003cdiv id=\"m-s2\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S3 · Join with a non-defining clause\u003c/h3>\u003cp class=\"task\">Join each pair into one sentence. Put the extra information between commas.\u003c/p>\u003cdiv id=\"m-s3\">\u003c/div>\u003c/div>\n  \u003cdiv class=\"ex\">\u003ch3>S4 · Ten-minute paragraph\u003c/h3>\u003cdiv id=\"m-s4\">\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003csection class=\"sec\" id=\"s-x\">\n  \u003cdiv class=\"sec-h\">\u003cspan class=\"time\">Review\u003c/span>\u003ch2>Your review\u003c/h2>\u003cp class=\"lead\">Questions you missed on the first try appear here. Go back to them next lesson.\u003c/p>\u003c/div>\n  \u003cdiv class=\"review\">\u003cdiv id=\"rv\">\u003c/div>\n  \u003cp style=\"margin-top:18px\">\u003cb>My answers sheet.\u003c/b> \u003cspan class=\"muted\">Everything you typed, in one place. Copy it and paste it into the Kwiga task or keep it for your notes.\u003c/span>\u003c/p>\n  \u003ctextarea id=\"sheet\" rows=\"10\" readonly aria-label=\"My answers sheet\">\u003c/textarea>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" id=\"copysheet\">Copy my answers\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" id=\"reset\">Start again\u003c/button>\u003cspan class=\"sum\" id=\"sheet-s\">\u003c/span>\u003c/div>\u003c/div>\n\u003c/section>\n\n\u003cp class=\"foot\">Target English · Lesson on Relative Clauses in Task 2. Your answers stay in this page only.\u003c/p>\n\u003c/main>\n\n\u003cscript>\n(function(){\nconst $=s=>document.querySelector(s);\nconst SECS=[['w','Warm-up','0–8'],['i','Input','8–22'],['p','Practice','22–40'],['r','Reading','40–55'],['v','Vocabulary','55–70'],['o','Production','70–85'],['e','Exit','85–90']];\nfunction hs(str){let x=1779033703^str.length;for(let i=0;i\u003cstr.length;i++){x=Math.imul(x^str.charCodeAt(i),3432918353);x=x\u003c\u003c13|x>>>19}return x>>>0}\nfunction rng(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}\nfunction shuf(arr,key){const r=rng(hs(key));const a=arr.map((v,i)=>[v,i]);for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}\nconst nm=s=>s.toLowerCase().replace(/[’‘]/g,\"'\").replace(/n't\\b/g,\" not\").replace(/[.,;!?]+$/,'').replace(/\\s+/g,' ').trim();\nconst ST={},MQ={},GB={},SB={},WB={};\nconst KEY='rel-state-v2';\nconst EMPTY=()=>({first:{},vals:{},mcq:{},shown:{},rated:{},checked:{},pi:{}});\nlet SAVE=EMPTY();const PR={};let svT=null;\nfunction loadSave(){try{const x=JSON.parse(localStorage.getItem(KEY)||'null');if(x&&x.first)SAVE=Object.assign(EMPTY(),x)}catch(e){}}\nfunction persist(){clearTimeout(svT);svT=setTimeout(()=>{let ok=true;try{localStorage.setItem(KEY,JSON.stringify(SAVE))}catch(e){ok=false}const el=$('#st-save');if(el)el.textContent=ok?'Saved on this device ✓':'Auto-save is off here. Use “Copy my answers” at the end.'},250)}\nfunction reg(id,sec,label){ST[id]={sec,label,first:null}}\nfunction rec(id,ok){if(ST[id]&&ST[id].first===null){ST[id].first=ok;SAVE.first[id]=ok;persist()}refresh()}\nconst strip=x=>x.replace(/\u003c[^>]+>/g,'').replace('___','…');\nfunction mcqApply(q,i,good){const M=MQ[q],li=document.getElementById(q),o=li.querySelector('.opt[data-i=\"'+i+'\"]'),fb=li.querySelector('.fb');if(!o)return;fb.hidden=false;\n  if(good){li.dataset.done=1;o.classList.add('ok');li.querySelectorAll('.opt').forEach(b=>b.disabled=true);fb.className='fb ok';fb.innerHTML='\u003cb>Correct.\u003c/b> '+M.e}\n  else{o.classList.add('bad');o.disabled=true;fb.className='fb bad';fb.textContent='Not quite. Try another option.'}}\nfunction rateText(id,good){const f=$('#r-'+id);f.hidden=false;f.className='fb '+(good?'ok':'bad');f.textContent=good?'Good. Keep this pattern for your essay.':'Compare each part with the model, then try the sentence again.'}\nfunction restore(){\n  Object.keys(SAVE.first).forEach(id=>{if(ST[id])ST[id].first=SAVE.first[id]});\n  Object.keys(SAVE.vals).forEach(id=>{const el=document.getElementById(id);if(el)el.value=SAVE.vals[id]});\n  Object.keys(SAVE.mcq).forEach(q=>{if(!MQ[q]||!document.getElementById(q))return;const sv=SAVE.mcq[q];sv.w.forEach(i=>mcqApply(q,i,false));if(sv.d)mcqApply(q,MQ[q].c,true)});\n  Object.keys(SAVE.checked).forEach(b=>{if(GB[b])checkGap(b)});\n  Object.keys(SAVE.shown).forEach(id=>{const m=$('#m-'+id);if(m){m.hidden=false;const b=document.querySelector('[data-show=\"'+id+'\"]');if(b)b.hidden=true}});\n  Object.keys(SAVE.rated).forEach(id=>{if($('#r-'+id))rateText(id,String(SAVE.rated[id])==='1')});\n  Object.keys(WB).forEach(b=>{const pi=SAVE.pi[b]||0;WB[b].pi=pi;const wp=$('#wp-'+b);if(wp&&WB[b].cfg.prompts[pi])wp.innerHTML=WB[b].cfg.prompts[pi].t;document.querySelectorAll('[data-wpick=\"'+b+'\"]').forEach(x=>x.classList.toggle('on',+x.dataset.i===pi));updW(b)});\n}\nfunction refreshSheet(){const ta=$('#sheet');if(!ta)return;const out=['Relative Clauses in Task 2: my answers',''];\n  Object.entries(ST).forEach(([id,v])=>{const c=document.getElementById('c-'+id)||document.getElementById('w-'+id);if(!c||!c.value.trim())return;out.push(v.label+': '+(PR[id]?PR[id]+'\\n   → ':'')+c.value.trim())});\n  ta.value=out.join('\\n')}\n\n/* ---------- builders ---------- */\nfunction mcq(id,sec,label,prompt,opts,ci,exp){\n  reg(id,sec,label);MQ[id]={c:ci,e:exp};\n  const o=shuf(opts,id).map(([t,i])=>`\u003cbutton class=\"opt\" type=\"button\" data-q=\"${id}\" data-i=\"${i}\">${t}\u003c/button>`).join('');\n  return `\u003cli id=\"${id}\">\u003cp class=\"qp\">${prompt}\u003c/p>\u003cdiv class=\"opts\">${o}\u003c/div>\u003cp class=\"fb\" hidden>\u003c/p>\u003c/li>`;\n}\nfunction gapBlock(bid,sec,lab,items,o){\n  GB[bid]={items,mode:o.mode};\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);PR[id]=strip(it.s);\n    let ctl;\n    if(o.mode==='select'){\n      const opts=o.bank||shuf(it.opts,id).map(x=>x[0]);\n      ctl=`\u003cselect id=\"c-${id}\" aria-label=\"Answer ${n+1}\">\u003coption value=\"\">choose\u003c/option>${opts.map(x=>`\u003coption>${x}\u003c/option>`).join('')}\u003c/select>`;\n    }else ctl=`\u003cinput id=\"c-${id}\" type=\"text\" autocomplete=\"off\" autocapitalize=\"off\" spellcheck=\"false\" size=\"${it.w||11}\" aria-label=\"Answer ${n+1}\">`;\n    ctl+=it.h?`\u003cspan class=\"hint\">${it.h}\u003c/span>`:'';\n    const body=it.s.includes('___')?it.s.replace('___',ctl):`\u003cp class=\"qp\">${it.s}\u003c/p>${ctl}`;\n    return `\u003cli class=\"gi\" id=\"li-${id}\">\u003cdiv>${body}\u003c/div>\u003cp class=\"fb\" id=\"f-${id}\" hidden>\u003c/p>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>\u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-check=\"${bid}\">Check answers\u003c/button>\u003cspan class=\"sum\" id=\"sum-${bid}\">\u003c/span>\u003c/div>`;\n}\nfunction checkGap(bid){\n  const B=GB[bid];let ok=0,att=0;SAVE.checked[bid]=1;persist();\n  B.items.forEach((it,n)=>{\n    const id=`${bid}-${n+1}`,c=$('#c-'+id),v=c.value.trim(),li=$('#li-'+id),f=$('#f-'+id);\n    if(!v){li.className='gi';f.hidden=true;return}\n    att++;const acc=[].concat(it.a);\n    const good=B.mode==='select'?acc.includes(v):acc.map(nm).includes(nm(v));\n    if(good)ok++;\n    li.className='gi '+(good?'ok':'bad');f.hidden=false;\n    f.innerHTML=good?`\u003cb>Correct.\u003c/b> ${it.e||''}`:`Answer: \u003cb>${acc[0]}\u003c/b>. ${it.e||''}`;\n    rec(id,good);\n  });\n  $('#sum-'+bid).textContent=att?`${ok} of ${att} correct`:'Answer at least one question first.';\n}\nfunction selfBlock(bid,sec,lab,items){\n  const lis=items.map((it,n)=>{\n    const id=`${bid}-${n+1}`;reg(id,sec,`${lab} ${n+1}`);SB[id]=1;PR[id]=strip(it.p);\n    return `\u003cli class=\"si\" id=\"li-${id}\">\u003cdiv>\u003cp class=\"plain\">${it.p}\u003c/p>${it.t?`\u003cp class=\"use\">Use: ${it.t}\u003c/p>`:''}\n      \u003ctextarea id=\"c-${id}\" rows=\"2\" data-d=\"${id}\" placeholder=\"Write your sentence here\" aria-label=\"Your sentence ${n+1}\">\u003c/textarea>\n      \u003cp class=\"nudge\" id=\"n-${id}\" hidden>Write your own version first, then compare it with the model.\u003c/p>\n      \u003cbutton class=\"btn ghost sm\" type=\"button\" data-show=\"${id}\">Show the model\u003c/button>\n      \u003cdiv class=\"model\" id=\"m-${id}\" hidden>\u003cp>\u003cb>Model:\u003c/b> ${it.m}\u003c/p>${it.n?`\u003cp class=\"note\">${it.n}\u003c/p>`:''}\n      \u003cp>Your sentence can be different from the model. Does it use the right structure correctly?\u003c/p>\u003cspan class=\"rate\">\u003cbutton class=\"btn sm\" type=\"button\" data-rate=\"${id}\" data-v=\"1\">Yes, mine works\u003c/button>\u003cbutton class=\"btn sm ghost\" type=\"button\" data-rate=\"${id}\" data-v=\"0\">No, I need more practice\u003c/button>\u003c/span>\u003cp class=\"fb\" id=\"r-${id}\" hidden>\u003c/p>\u003c/div>\u003c/div>\u003c/li>`;\n  }).join('');\n  return `\u003col class=\"qs\">${lis}\u003c/ol>`;\n}\nconst NAMES={defining:'Defining who / which',nondef:'Non-defining , which / , who',whose:'Whose',prep:'Preposition + whom / which',whole:', which (whole idea)',reduced:'Reduced relative'};\nconst PREPS=['in','to','on','of','for','with','by','at','from','about','through'];\nfunction detect(t){\n  const x=t.replace(/\\r/g,'');\n  const words=(x.trim().match(/\\S+/g)||[]).length,s=new Set();\n  const re=/(\\S+)\\s+(who|whom|which)\\b/gi;let m;\n  while((m=re.exec(x))){\n    const prev=m[1].toLowerCase();const after=x.slice(m.index+m[0].length,m.index+m[0].length+90);\n    if(prev.endsWith(',')){\n      const cut=after.search(/[.!?]/);const seg=cut\u003c0?after:after.slice(0,cut);\n      if(/,/.test(seg)&&/^\\s+(is|are|was|were|has|have|had|can|receives|provides|offers|\\w+s)\\b/i.test(seg)&&m[2].toLowerCase()!=='which')s.add('nondef');\n      else if(m[2].toLowerCase()==='which'&&/,/.test(seg)&&!/^\\s+(means|has led|have led|can cause|forced|makes|caused|leads|suggests)/i.test(seg))s.add('nondef');\n      else s.add('whole');\n    }else if(PREPS.includes(prev)){s.add('prep')}\n    else if(/^(.)*[a-z]$/.test(prev)){s.add('defining')}\n  }\n  if(/\\bwhose\\b/i.test(x))s.add('whose');\n  const stop=['is','was','has','does','as','this','its','his','us','always','also','often','was'];\n  const re2=/\\b([a-z]+s)\\s+(\\w+ing|introduced|published|given|used|made|designed|affected|caused|based|employed|trained|educated)\\b/gi;\n  while((m=re2.exec(x))){if(!stop.includes(m[1].toLowerCase()))s.add('reduced')}\n  const warns=[];\n  if(/,\\s+that\\s+(is|are|was|were|has|have|can|will|makes|means)\\b/i.test(x))warns.push('Do not use “that” after a comma. Use which (things) or who (people).');\n  if(/(^|[.!?]\\s+)which\\b/.test(x))warns.push('A sentence cannot start with Which. Join it to the first sentence with a comma.');\n  if(/\\b(in|to|on|for|with|of|by|at|from)\\s+who\\b/i.test(x))warns.push('After a preposition use whom (people) or which (things), not who.');\n  if(/\\bwho[’']s\\s+(economy|economies|population|children|parents|government|income|incomes|jobs|members|salary)\\b/i.test(x))warns.push('Use whose, not who’s, to show possession.');\n  if(/\\b(what)\\s+(is|are|was|has|have|makes)\\b/i.test(x)&&/,\\s*what\\b/i.test(x))warns.push('Do not use “what” as a relative pronoun. Use which.');\n  return{words,s,warns};\n}\nfunction writeBlock(bid,sec,lab,cfg){\n  WB[bid]={cfg,pi:0};reg(bid,sec,lab);\n  const seg=cfg.prompts.length>1?`\u003cdiv class=\"seg\">${cfg.prompts.map((p,i)=>`\u003cbutton class=\"segb${i?'':' on'}\" type=\"button\" data-wpick=\"${bid}\" data-i=\"${i}\">${p.tab}\u003c/button>`).join('')}\u003c/div>`:'';\n  return `\u003cdiv id=\"wb-${bid}\">${seg}\u003cblockquote class=\"prompt\" id=\"wp-${bid}\">${cfg.prompts[0].t}\u003c/blockquote>\n  ${cfg.timer?`\u003cdiv class=\"timer\">\u003cspan id=\"wt-${bid}\" class=\"clock\">10:00\u003c/span>\u003cbutton class=\"btn ghost sm\" type=\"button\" data-wtimer=\"${bid}\">Start timer\u003c/button>\u003c/div>`:''}\n  \u003ctextarea id=\"w-${bid}\" data-w=\"${bid}\" rows=\"8\" placeholder=\"Write your paragraph here\" aria-label=\"Your paragraph\">\u003c/textarea>\n  \u003cdiv class=\"wmeta\">\u003cspan id=\"wc-${bid}\">0 words\u003c/span>\u003cspan class=\"muted\">target ${cfg.min}–${cfg.max}\u003c/span>\u003cspan class=\"muted\" id=\"wf2-${bid}\">\u003c/span>\u003c/div>\n  \u003cul class=\"chk\" id=\"wk-${bid}\">\u003c/ul>\n  \u003cdiv class=\"actions\">\u003cbutton class=\"btn\" type=\"button\" data-wcheck=\"${bid}\">Check my paragraph\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wcopy=\"${bid}\">Copy text\u003c/button>\u003cbutton class=\"btn ghost\" type=\"button\" data-wmodel=\"${bid}\">Show a model\u003c/button>\u003cspan class=\"sum\" id=\"ws-${bid}\">\u003c/span>\u003c/div>\n  \u003cdiv class=\"model\" id=\"wm-${bid}\" hidden>\u003c/div>\n  \u003cp class=\"note\" style=\"margin-top:10px\">Copy your paragraph and paste it into the writing task that follows this lesson, so your teacher can give feedback.\u003c/p>\u003c/div>`;\n}\nfunction updW(bid){\n  const c=WB[bid].cfg,t=$('#w-'+bid).value,d=detect(t);\n  $('#wc-'+bid).textContent=d.words+' words';\n  const found=[...d.s].map(k=>NAMES[k]).join(', ');\n  $('#wf2-'+bid).textContent=found?'found: '+found:'';\n  const L=[[d.words>=c.min,`At least ${c.min} words`]];\n  if(c.req){c.req.forEach(r=>L.push([r.k.some(k=>d.s.has(k)),r.l]))}\n  else L.push([[...d.s].length>=2,'At least two different structures']);\n  const rows=L.map(([y,l])=>`\u003cli class=\"${y?'y':''}\">${l}\u003c/li>`);\n  if(d.warns.length)rows.push(`\u003cli class=\"w\">${d.warns[0]}\u003c/li>`);else if(d.words>5)rows.push('\u003cli class=\"y\">No common mistakes found\u003c/li>');\n  $('#wk-'+bid).innerHTML=rows.join('');\n  return{d,L};\n}\n\n/* ---------- content ---------- */\nconst STRUCT=['Defining who / which','Non-defining , which / , who','Whose','Preposition + whom / which',', which (whole idea)','Reduced relative'];\nconst TBL=[\n ['Identify a noun (defining)'],\n ['Defining who / which / that','noun | who / which / that + verb','Say exactly which people or things you mean','Volunteers \u003cb>who\u003c/b> receive proper training are more likely to stay.','No commas. Who for people, which for things. That is also possible. Never “what”. Do not repeat the object: the plan which many people support (not “support it”).'],\n ['Whose','noun | whose + noun + verb','Show that something belongs to or belongs with the noun','Families \u003cb>whose\u003c/b> parents work long hours often rely on grandparents for childcare.','Whose + noun. Never “who’s” (= who is). Whose works for people and things.'],\n ['Preposition + whom / which','noun | preposition + whom / which + clause','Formal style. Typical in essays: the extent to which, an area in which','Retirement is a stage of life \u003cb>in which\u003c/b> many people discover new interests.','After a preposition use whom (people) or which (things). Never who or that.'],\n ['Add extra information (non-defining)'],\n ['Non-defining , which / , who','noun | , who / which + extra information ,','Add a fact or comment. You could remove it','The museum\u003cb>, which\u003c/b> was built in 1890\u003cb>,\u003c/b> attracts half a million visitors a year.','Two commas (or one at the end of the sentence). Only who / which, never that.'],\n [', which (whole idea)','whole clause | , which + verb','Comment on the whole idea before the comma: a result or an opinion','Many charities rely on donations\u003cb>, which\u003c/b> fall sharply during economic crises.','Which refers to the whole idea. Never “that”. Never start a new sentence with Which.'],\n ['Shorten the clause'],\n ['Reduced relative','noun | -ing / -ed phrase','Make the sentence shorter and more academic','Volunteers \u003cb>working\u003c/b> with children need a background check. / Donations \u003cb>made\u003c/b> online have increased.','Only when who / which is
